<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#08070d">

<title>Studio - Reitoon</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

:root{

--bg:#08070d;
--surface:#191722;
--surface-light:#211f2b;
--text:#fff;
--muted:#aaa3b0;
--pink:#ff2f8d;
--purple:#762dff;
--border:rgba(255,255,255,.1);

}

body{

min-height:100vh;

background:
radial-gradient(
circle at 100% 0%,
rgba(255,40,145,.14),
transparent 35%
),
radial-gradient(
circle at 0% 30%,
rgba(112,45,255,.1),
transparent 30%
),
var(--bg);

color:white;
font-family:Arial,Helvetica,sans-serif;

padding-bottom:100px;

}

.header{

height:76px;

display:flex;
align-items:center;
justify-content:space-between;

padding:16px 20px;

background:rgba(8,7,13,.94);
border-bottom:1px solid var(--border);

position:sticky;
top:0;
z-index:10;

}

.back{

width:42px;
height:42px;

border-radius:14px;

border:1px solid var(--border);

background:var(--surface);
color:white;

font-size:20px;

}

.logo{

font-size:28px;
font-weight:800;

background:
linear-gradient(
135deg,
white,
var(--pink),
var(--purple)
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

.container{

width:100%;
max-width:600px;

margin:auto;

padding:26px 16px;

}

.title{

font-size:30px;
margin-bottom:8px;

}

.title span{

background:
linear-gradient(
135deg,
var(--pink),
var(--purple)
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

.subtitle{

color:var(--muted);
font-size:14px;
line-height:1.5;

margin-bottom:22px;

}

.stats{

display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;

margin-bottom:22px;

}

.stat{

padding:16px 8px;

text-align:center;

border-radius:16px;

background:var(--surface);
border:1px solid var(--border);

}

.stat strong{

display:block;
font-size:19px;
margin-bottom:5px;

}

.stat span{

color:var(--muted);
font-size:10px;

}

.empty{

padding:55px 20px;

text-align:center;

border:1px dashed rgba(255,255,255,.2);
border-radius:22px;

background:rgba(255,255,255,.02);

}

.empty-icon{

font-size:50px;
margin-bottom:14px;

}

.empty h2{

font-size:20px;
margin-bottom:8px;

}

.empty p{

color:var(--muted);
font-size:13px;
line-height:1.5;
margin-bottom:20px;

}

.create-button{

display:inline-block;

padding:14px 20px;

border-radius:13px;

text-decoration:none;

color:white;

font-weight:bold;
font-size:13px;

background:
linear-gradient(
135deg,
var(--pink),
var(--purple)
);

}

.story-list{

display:flex;
flex-direction:column;
gap:15px;

}

.story-card{

padding:16px;

border-radius:20px;

background:var(--surface);
border:1px solid var(--border);

}

.story-top{

display:flex;
gap:14px;

}

.story-cover{

width:85px;
height:115px;

border-radius:12px;

background:
linear-gradient(
135deg,
var(--pink),
var(--purple)
);

display:flex;
align-items:center;
justify-content:center;

font-size:28px;

overflow:hidden;
flex-shrink:0;

}

.story-cover img{

width:100%;
height:100%;
object-fit:cover;

}

.story-info{

flex:1;

}

.story-info h2{

font-size:17px;
margin-bottom:6px;

}

.story-meta{

font-size:11px;
color:var(--pink);

margin-bottom:8px;

}

.story-description{

font-size:12px;
color:var(--muted);
line-height:1.5;

display:-webkit-box;
-webkit-line-clamp:3;
-webkit-box-orient:vertical;
overflow:hidden;

}

.status{

display:inline-block;

margin-top:10px;

padding:5px 9px;

border-radius:20px;

font-size:10px;

background:rgba(255,47,141,.15);
color:#ff7ab3;

}

.actions{

display:flex;
gap:8px;

margin-top:15px;

}

.action{

flex:1;

padding:11px;

border-radius:11px;

border:1px solid var(--border);

background:var(--surface-light);

color:white;

font-size:11px;
font-weight:bold;

cursor:pointer;

}

.action.primary{

border:none;

background:
linear-gradient(
135deg,
var(--pink),
var(--purple)
);

}

.action.delete{

color:#ff6b8a;

}

.bottom-nav{

position:fixed;
bottom:0;
left:0;
right:0;

height:76px;

display:flex;
justify-content:space-around;
align-items:center;

background:rgba(14,13,21,.96);

border-top:1px solid var(--border);

z-index:20;

}

.nav-item{

color:var(--muted);
text-decoration:none;

text-align:center;
font-size:10px;

min-width:60px;

}

.nav-icon{

display:block;
font-size:21px;
margin-bottom:4px;

}

.nav-item.active{

color:var(--pink);

}

</style>

</head>

<body>

<header class="header">

<button
class="back"
onclick="history.back()"
>

←

</button>

<div class="logo">Reitoon</div>

<div style="width:42px;"></div>

</header>


<main class="container">

<h1 class="title">

My <span>Studio</span>

</h1>

<p class="subtitle">

Kelola semua cerita dan project kamu di satu tempat.

</p>


<section class="stats">

<div class="stat">

<strong id="storyCount">0</strong>

<span>Total Story</span>

</div>

<div class="stat">

<strong id="viewCount">0</strong>

<span>Views</span>

</div>

<div class="stat">

<strong>Rp0</strong>

<span>Earnings</span>

</div>

</section>


<section
class="empty"
id="emptyState"
>

<div class="empty-icon">✨</div>

<h2>Belum ada cerita</h2>

<p>

Mulai buat cerita pertama kamu dan bangun dunia kreatifmu bersama Reitoon.

</p>

<a
href="create.html"
class="create-button"
>

🚀 Create Your Story

</a>

</section>


<section
class="story-list"
id="storyList"
>

</section>

</main>


<nav class="bottom-nav">

<a class="nav-item" href="index.html">

<span class="nav-icon">🏠</span>
Home

</a>

<a class="nav-item" href="watch.html">

<span class="nav-icon">▶️</span>
Watch

</a>

<a class="nav-item" href="create.html">

<span class="nav-icon">✨</span>
Create

</a>

<a class="nav-item active" href="studio.html">

<span class="nav-icon">🎥</span>
Studio

</a>

<a class="nav-item" href="profile.html">

<span class="nav-icon">👤</span>
Profile

</a>

</nav>


<script>

function loadStories(){

const stories=JSON.parse(

localStorage.getItem("reitoon_stories")

)||[];

const list=document.getElementById("storyList");

const empty=document.getElementById("emptyState");

document.getElementById("storyCount")
.textContent=stories.length;


if(stories.length===0){

empty.style.display="block";

list.innerHTML="";

return;

}


empty.style.display="none";

let totalViews=0;

stories.forEach(story=>{

totalViews+=story.views||0;

});


document.getElementById("viewCount")
.textContent=totalViews;


list.innerHTML="";


stories.slice().reverse().forEach(story=>{

const card=document.createElement("article");

card.className="story-card";


const cover=story.cover

?`<img src="${story.cover}">`

:"🎬";


card.innerHTML=`

<div class="story-top">

<div class="story-cover">

${cover}

</div>

<div class="story-info">

<h2>${story.title}</h2>

<div class="story-meta">

${story.type} • ${story.genre}

</div>

<div class="story-description">

${story.description}

</div>

<span class="status">

${story.status==="public"?"PUBLIC":"DRAFT"}

</span>

</div>

</div>


<div class="actions">

<button
class="action primary"
onclick="openDetail(${story.id})"
>

▶️ View

</button>

<button
class="action"
onclick="editStory(${story.id})"
>

✏️ Edit

</button>

<button
class="action delete"
onclick="deleteStory(${story.id})"
>

🗑️ Delete

</button>

</div>

`;

list.appendChild(card);

});

}


function openDetail(id){

window.location.href="detail.html?id="+id;

}


function editStory(id){

const stories=JSON.parse(

localStorage.getItem("reitoon_stories")

)||[];

const story=stories.find(item=>item.id===id);

if(!story)return;

localStorage.setItem(

"reitoon_story_edit",

JSON.stringify(story)

);

window.location.href="create.html";

}


function deleteStory(id){

if(!confirm("Hapus cerita ini?"))return;

let stories=JSON.parse(

localStorage.getItem("reitoon_stories")

)||[];

stories=stories.filter(

story=>story.id!==id

);

localStorage.setItem(

"reitoon_stories",

JSON.stringify(stories)

);

loadStories();

}


loadStories();

</script>

</body>

</html>
