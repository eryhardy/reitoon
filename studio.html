<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#08070d"
  >

  <title>Studio - Reitoon</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

  <header class="top-header">

    <button
      class="back-button"
      onclick="history.back()"
    >
      ←
    </button>

    <div class="brand-name">
      Reitoon
    </div>

    <div style="width:42px;"></div>

  </header>


  <main class="container">

    <span class="section-label">
      CREATOR CENTER
    </span>

    <h1 style="font-size:31px;margin-top:8px;">
      My <span style="color:#ff2f8d;">Studio</span>
    </h1>

    <p style="color:#aaa3b0;font-size:14px;margin-top:8px;">
      Kelola cerita dan project kamu.
    </p>


    <section class="stats">

      <div class="stat">

        <strong id="storyCount">
          0
        </strong>

        <span>
          Stories
        </span>

      </div>


      <div class="stat">

        <strong>
          0
        </strong>

        <span>
          Views
        </span>

      </div>


      <div class="stat">

        <strong>
          Rp0
        </strong>

        <span>
          Earnings
        </span>

      </div>

    </section>


    <section
      id="emptyState"
      class="form-card"
      style="text-align:center;padding:45px 20px;"
    >

      <div style="font-size:48px;">
        ✨
      </div>

      <h2 style="margin-top:12px;">
        Belum ada cerita
      </h2>

      <p style="color:#aaa3b0;font-size:13px;margin:10px 0 20px;">
        Buat cerita pertama kamu di Reitoon.
      </p>

      <a
        href="create.html"
        class="create-button"
        style="display:inline-block;text-decoration:none;"
      >
        🚀 Create Story
      </a>

    </section>


    <section
      id="storyCard"
      class="story-card"
      style="display:none;padding:18px;"
    >

      <h2 id="storyTitle">
        My Story
      </h2>

      <p
        id="storyType"
        style="color:#ff2f8d;margin-top:10px;"
      ></p>

      <p
        id="storyGenre"
        style="color:#aaa3b0;font-size:13px;margin-top:6px;"
      ></p>

      <p
        id="storyDescription"
        style="color:#aaa3b0;font-size:13px;line-height:1.6;margin-top:15px;"
      ></p>


      <div style="display:flex;gap:10px;margin-top:20px;">

        <button
          class="primary-button"
          onclick="generateFilm()"
        >
          🎬 Generate Film
        </button>

        <button
          class="action-button"
          onclick="deleteStory()"
        >
          🗑️
        </button>

      </div>

    </section>

  </main>


  <nav class="bottom-navigation">

    <a class="nav-item" href="index.html">
      <span class="nav-icon">🏠</span>
      Home
    </a>

    <a class="nav-item" href="watch.html">
      <span class="nav-icon">▶️</span>
      Watch
    </a>

    <a class="nav-item" href="create.html">
      <span class="nav-icon">✨</span>
      Create
    </a>

    <a class="nav-item active" href="studio.html">
      <span class="nav-icon">🎥</span>
      Studio
    </a>

    <a class="nav-item" href="profile.html">
      <span class="nav-icon">👤</span>
      Profile
    </a>

  </nav>


  <script>

    function loadStory() {

      const saved =
        localStorage.getItem(
          "reitoon_story"
        );

      if (!saved) return;

      const story =
        JSON.parse(saved);


      document
        .getElementById("emptyState")
        .style.display = "none";


      document
        .getElementById("storyCard")
        .style.display = "block";


      document
        .getElementById("storyCount")
        .textContent = "1";


      document
        .getElementById("storyTitle")
        .textContent =
          story.title;


      document
        .getElementById("storyType")
        .textContent =
          "🎬 " + story.type;


      document
        .getElementById("storyGenre")
        .textContent =
          "Genre: " + story.genre;


      document
        .getElementById("storyDescription")
        .textContent =
          story.description;

    }


    function generateFilm() {

      alert(
        "🎬 Fitur AI Film akan menggunakan AI Credit."
      );

    }


    function deleteStory() {

      if (
        !confirm(
          "Hapus cerita ini?"
        )
      ) return;

      localStorage.removeItem(
        "reitoon_story"
      );

      location.reload();

    }


    loadStory();

  </script>

</body>
</html>
