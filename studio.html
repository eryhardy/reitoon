<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08070d">
<title>Studio - Reitoon</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--bg:#08070d;
--surface:#191722;
--surface-light:#211f2b;
--muted:#aaa3b0;
--pink:#ff2f8d;
--purple:#762dff;
--border:rgba(255,255,255,.1)
}

body{
min-height:100vh;
background:
radial-gradient(circle at 100% 0%,rgba(255,40,145,.14),transparent 35%),
radial-gradient(circle at 0% 30%,rgba(112,45,255,.1),transparent 30%),
var(--bg);
color:#fff;
font-family:Arial,Helvetica,sans-serif;
padding-bottom:100px
}

.header{
height:76px;
display:flex;
align-items:center;
justify-content:space-between;
padding:16px 20px;
background:rgba(8,7,13,.94);
border-bottom:1px solid var(--border);
position:sticky;
top:0;
z-index:10
}

.back{
width:42px;
height:42px;
border-radius:14px;
border:1px solid var(--border);
background:var(--surface);
color:#fff;
font-size:20px
}

.logo{
font-size:29px;
font-weight:800;
background:linear-gradient(135deg,#fff,var(--pink),var(--purple));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent
}

.container{
max-width:600px;
margin:auto;
padding:28px 16px
}

.title{font-size:30px}
.title span{
background:linear-gradient(135deg,var(--pink),var(--purple));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent
}

.subtitle{
color:var(--muted);
font-size:14px;
line-height:1.5;
margin-top:8px
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:22px
}

.stat{
padding:16px 8px;
text-align:center;
border-radius:16px;
background:var(--surface);
border:1px solid var(--border)
}

.stat strong{
display:block;
font-size:19px
}

.stat span{
display:block;
color:var(--muted);
font-size:10px;
margin-top:5px
}

.empty{
margin-top:22px;
padding:50px 20px;
text-align:center;
border:1px dashed rgba(255,255,255,.2);
border-radius:22px
}

.empty-icon{font-size:48px}
.empty h2{margin-top:12px}
.empty p{
color:var(--muted);
font-size:13px;
line-height:1.5;
margin:8px 0 20px
}

.create-btn{
display:inline-block;
padding:13px 18px;
border-radius:12px;
background:linear-gradient(135deg,var(--pink),var(--purple));
color:#fff;
text-decoration:none;
font-weight:bold;
font-size:13px
}

.story-card{
display:none;
margin-top:22px;
padding:18px;
border-radius:20px;
background:var(--surface);
border:1px solid var(--border)
}

.cover{
width:100%;
height:210px;
object-fit:cover;
border-radius:15px;
background:
linear-gradient(135deg,var(--pink),var(--purple))
}

.story-title{
font-size:21px;
margin-top:15px
}

.meta{
color:var(--pink);
font-size:12px;
margin-top:6px
}

.description{
color:var(--muted);
font-size:13px;
line-height:1.6;
margin-top:12px
}

.status{
display:inline-block;
margin-top:12px;
padding:6px 10px;
border-radius:20px;
font-size:10px;
background:rgba(255,47,141,.15);
color:#ff75b0
}

.actions{
display:flex;
gap:10px;
margin-top:18px
}

.action{
flex:1;
padding:12px;
border:1px solid var(--border);
border-radius:12px;
background:var(--surface-light);
color:#fff;
font-weight:bold
}

.action.primary{
border:none;
background:linear-gradient(135deg,var(--pink),var(--purple))
}

.action.delete{color:#ff6b8a}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:76px;
display:flex;
justify-content:space-around;
align-items:center;
background:rgba(14,13,21,.96);
border-top:1px solid var(--border);
z-index:20
}

.nav{
color:var(--muted);
text-decoration:none;
text-align:center;
font-size:10px
}

.nav-icon{
display:block;
font-size:21px;
margin-bottom:4px
}

.nav.active{color:var(--pink)}
</style>
</head>

<body>

<header class="header">

<button class="back" onclick="history.back()">←</button>

<div class="logo">Reitoon</div>

<div style="width:42px"></div>

</header>

<main class="container">

<h1 class="title">
My <span>Studio</span>
</h1>

<p class="subtitle">
Kelola cerita dan project kamu di satu tempat.
</p>

<section class="stats">

<div class="stat">
<strong id="storyCount">0</strong>
<span>Stories</span>
</div>

<div class="stat">
<strong id="viewCount">0</strong>
<span>Views</span>
</div>

<div class="stat">
<strong>Rp0</strong>
<span>Earnings</span>
</div>

</section>

<section class="empty" id="empty">

<div class="empty-icon">✨</div>

<h2>Belum ada cerita</h2>

<p>
Buat cerita pertamamu dan publikasikan ke Reitoon.
</p>

<a class="create-btn" href="create.html">
🚀 Create Story
</a>

</section>

<section class="story-card" id="storyCard">

<img id="cover" class="cover">

<h2 id="title" class="story-title"></h2>

<div id="meta" class="meta"></div>

<p id="description" class="description"></p>

<span id="status" class="status"></span>

<div class="actions">

<button class="action primary" onclick="openStory()">
▶️ Lihat Detail
</button>

<button class="action" onclick="editStory()">
✏️ Edit
</button>

<button class="action delete" onclick="deleteStory()">
🗑️
</button>

</div>

</section>

</main>

<nav class="bottom-nav">

<a class="nav" href="index.html">
<span class="nav-icon">🏠</span>
Home
</a>

<a class="nav" href="watch.html">
<span class="nav-icon">▶️</span>
Watch
</a>

<a class="nav" href="create.html">
<span class="nav-icon">✨</span>
Create
</a>

<a class="nav active" href="studio.html">
<span class="nav-icon">🎥</span>
Studio
</a>

<a class="nav" href="profile.html">
<span class="nav-icon">👤</span>
Profile
</a>

</nav>

<script>

let story=null;

function loadStory(){

const saved=localStorage.getItem("reitoon_story");

if(!saved)return;

story=JSON.parse(saved);

document.getElementById("empty").style.display="none";
document.getElementById("storyCard").style.display="block";

document.getElementById("storyCount").textContent="1";
document.getElementById("viewCount").textContent=story.views||0;

document.getElementById("title").textContent=story.title;

document.getElementById("meta").textContent=
story.type+" • "+story.genre;

document.getElementById("description").textContent=
story.description;

document.getElementById("status").textContent=
story.status==="public"?"PUBLIC":"DRAFT";

const cover=document.getElementById("cover");

if(story.cover){

cover.src=story.cover;

}else{

cover.style.display="none";

}

}

function openStory(){

if(!story)return;

window.location.href=
"detail.html?id="+story.id;

}

function editStory(){

window.location.href="create.html";

}

function deleteStory(){

if(!confirm("Hapus cerita ini?"))return;

localStorage.removeItem("reitoon_story");

location.reload();

}

loadStory();

</script>

</body>
</html>
