<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<meta
name="theme-color"
content="#08070d"
>

<title>Detail Film - Reitoon</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

:root{

--bg:#08070d;
--surface:#191722;
--surface-light:#211f2b;
--text:#ffffff;
--muted:#aaa3b0;
--pink:#ff2f8d;
--purple:#762dff;
--border:rgba(255,255,255,.10);

}

body{

min-height:100vh;

background:

radial-gradient(
circle at 100% 0%,
rgba(255,40,145,.14),
transparent 35%
),

radial-gradient(
circle at 0% 30%,
rgba(112,45,255,.10),
transparent 30%
),

var(--bg);

color:var(--text);

font-family:
Arial,
Helvetica,
sans-serif;

padding-bottom:100px;

}


/* HEADER */

.header{

height:76px;

display:flex;

align-items:center;

justify-content:space-between;

padding:16px 20px;

background:rgba(8,7,13,.94);

border-bottom:1px solid var(--border);

position:sticky;

top:0;

z-index:20;

}

.back-button{

width:42px;

height:42px;

border-radius:14px;

border:1px solid var(--border);

background:var(--surface);

color:white;

font-size:20px;

cursor:pointer;

}

.logo{

font-size:29px;

font-weight:800;

background:

linear-gradient(
135deg,
white,
var(--pink),
var(--purple)
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

.header-space{

width:42px;

}


/* MAIN */

.container{

width:100%;

max-width:700px;

margin:auto;

}


/* HERO POSTER */

.poster{

position:relative;

width:100%;

height:390px;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

background:

linear-gradient(
135deg,
var(--pink),
var(--purple)
);

font-size:70px;

}

.poster img{

width:100%;

height:100%;

object-fit:cover;

}

.poster::after{

content:"";

position:absolute;

inset:0;

background:

linear-gradient(
to top,
rgba(8,7,13,.95),
transparent 60%
);

pointer-events:none;

}


/* PLAY BUTTON */

.big-play{

position:absolute;

left:50%;

top:50%;

transform:translate(-50%,-50%);

z-index:3;

width:70px;

height:70px;

border-radius:50%;

border:1px solid rgba(255,255,255,.4);

background:

linear-gradient(
135deg,
var(--pink),
var(--purple)
);

color:white;

font-size:28px;

cursor:pointer;

box-shadow:

0 10px 40px
rgba(255,47,141,.35);

}


/* CONTENT */

.content{

padding:22px 16px;

}

.title{

font-size:29px;

line-height:1.2;

margin-bottom:12px;

}

.meta{

display:flex;

gap:8px;

flex-wrap:wrap;

margin-bottom:18px;

}

.badge{

padding:7px 10px;

border-radius:8px;

background:var(--surface-light);

color:#ddd;

font-size:10px;

}

.description{

color:var(--muted);

font-size:14px;

line-height:1.7;

margin-bottom:22px;

}


/* ACTIONS */

.actions{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:10px;

margin-bottom:25px;

}

.action-button{

padding:14px;

border-radius:13px;

border:1px solid var(--border);

background:var(--surface);

color:white;

font-size:12px;

font-weight:bold;

cursor:pointer;

}

.action-button.primary{

background:

linear-gradient(
135deg,
var(--pink),
var(--purple)
);

border:none;

}


/* PLAYER */

.player-section{

display:none;

margin-bottom:25px;

}

.player-section.show{

display:block;

}

.player-title{

font-size:18px;

margin-bottom:12px;

}

.video-player{

width:100%;

aspect-ratio:16/9;

border-radius:17px;

background:#000;

border:1px solid var(--border);

display:flex;

align-items:center;

justify-content:center;

text-align:center;

padding:20px;

color:var(--muted);

font-size:13px;

}

.video-player video{

width:100%;

height:100%;

border-radius:17px;

}


/* INFO */

.info-card{

padding:18px;

border-radius:18px;

background:var(--surface);

border:1px solid var(--border);

margin-bottom:20px;

}

.info-row{

display:flex;

justify-content:space-between;

padding:11px 0;

border-bottom:1px solid var(--border);

font-size:12px;

}

.info-row:last-child{

border-bottom:none;

}

.info-row span:first-child{

color:var(--muted);

}

.info-row span:last-child{

font-weight:bold;

}


/* EMPTY */

.empty{

padding:50px 20px;

text-align:center;

color:var(--muted);

font-size:13px;

line-height:1.6;

}

.empty-icon{

font-size:50px;

margin-bottom:15px;

}


/* BOTTOM NAV */

.bottom-nav{

position:fixed;

bottom:0;

left:0;

right:0;

height:76px;

display:flex;

justify-content:space-around;

align-items:center;

background:rgba(14,13,21,.96);

backdrop-filter:blur(18px);

border-top:1px solid var(--border);

z-index:30;

}

.nav-item{

color:var(--muted);

text-decoration:none;

text-align:center;

font-size:10px;

min-width:60px;

}

.nav-icon{

display:block;

font-size:21px;

margin-bottom:4px;

}

.nav-item.active{

color:var(--pink);

}


/* TOAST */

.toast{

position:fixed;

left:50%;

bottom:95px;

transform:translateX(-50%) translateY(20px);

background:var(--surface-light);

border:1px solid var(--border);

border-radius:14px;

padding:13px 18px;

font-size:12px;

opacity:0;

pointer-events:none;

transition:.3s;

z-index:100;

white-space:nowrap;

}

.toast.show{

opacity:1;

transform:translateX(-50%) translateY(0);

}

</style>

</head>

<body>


<header class="header">

<button
class="back-button"
onclick="goBack()"
>

←

</button>

<div class="logo">

Reitoon

</div>

<div class="header-space"></div>

</header>


<main
class="container"
id="detailContainer"
>

</main>


<nav class="bottom-nav">

<a
class="nav-item"
href="index.html"
>

<span class="nav-icon">

🏠

</span>

Home

</a>


<a
class="nav-item active"
href="watch.html"
>

<span class="nav-icon">

▶️

</span>

Watch

</a>


<a
class="nav-item"
href="create.html"
>

<span class="nav-icon">

✨

</span>

Create

</a>


<a
class="nav-item"
href="studio.html"
>

<span class="nav-icon">

🎥

</span>

Studio

</a>


<a
class="nav-item"
href="profile.html"
>

<span class="nav-icon">

👤

</span>

Profile

</a>

</nav>


<div
class="toast"
id="toast"
>

</div>


<script>


let movie=null;


/* LOAD MOVIE */

function loadMovie(){

const savedMovie=

localStorage.getItem(
"reitoon_selected_movie"
);


if(!savedMovie){

showEmpty();

return;

}


movie=
JSON.parse(savedMovie);


renderDetail();

}


/* RENDER DETAIL */

function renderDetail(){

const container=

document
.getElementById(
"detailContainer"
);


const poster=

movie.cover

?

`

<img
src="${movie.cover}"
alt="Cover"
>

`

:

`

🎬

`;


container.innerHTML=

`

<section class="poster">

${poster}

<button
class="big-play"
onclick="playMovie()"
>

▶

</button>

</section>


<section class="content">

<h1 class="title">

${escapeHTML(movie.title)}

</h1>


<div class="meta">

<span class="badge">

${escapeHTML(movie.type || "Film")}

</span>

<span class="badge">

${escapeHTML(movie.genre || "Story")}

</span>

<span class="badge">

✨ Reitoon Original

</span>

</div>


<p class="description">

${escapeHTML(movie.description || "Tidak ada deskripsi.")}

</p>


<div class="actions">

<button
class="action-button primary"
onclick="playMovie()"
>

▶️ Mulai Menonton

</button>


<button
class="action-button"
onclick="shareMovie()"
>

🔗 Bagikan

</button>

</div>


<section
class="player-section"
id="playerSection"
>

<h2 class="player-title">

🎬 Pemutar Film

</h2>


<div
class="video-player"
id="videoPlayer"
>

Film siap diputar.

<br>

Video AI akan tersedia setelah project selesai dibuat.

</div>

</section>


<section class="info-card">

<div class="info-row">

<span>

Judul

</span>

<span>

${escapeHTML(movie.title)}

</span>

</div>


<div class="info-row">

<span>

Genre

</span>

<span>

${escapeHTML(movie.genre || "Story")}

</span>

</div>


<div class="info-row">

<span>

Tipe

</span>

<span>

${escapeHTML(movie.type || "Film")}

</span>

</div>


<div class="info-row">

<span>

Status

</span>

<span>

Published

</span>

</div>

</section>

</section>

`;

}


/* PLAY */

function playMovie(){

const player=

document
.getElementById(
"playerSection"
);


if(!player){

return;

}


player.classList.add(
"show"
);


player.scrollIntoView({

behavior:"smooth"

});


showToast(

"🎬 Pemutar film dibuka"

);

}


/* SHARE */

function shareMovie(){

if(

navigator.share

){

navigator.share({

title:movie.title,

text:
"Tonton "+
movie.title+
" di Reitoon"

});

}else{

navigator.clipboard.writeText(

window.location.href

);


showToast(

"🔗 Link berhasil disalin"

);

}

}


/* EMPTY */

function showEmpty(){

document
.getElementById(
"detailContainer"
)
.innerHTML=

`

<div class="empty">

<div class="empty-icon">

🎬

</div>

Film tidak ditemukan.

<br><br>

Silakan kembali ke halaman Watch.

</div>

`;

}


/* ESCAPE */

function escapeHTML(text){

const div=
document.createElement(
"div"
);

div.textContent=
text || "";

return div.innerHTML;

}


/* TOAST */

function showToast(message){

const toast=

document
.getElementById(
"toast"
);


toast.textContent=
message;


toast.classList.add(
"show"
);


setTimeout(function(){

toast.classList.remove(
"show"
);

},2500);

}


/* BACK */

function goBack(){

if(document.referrer){

history.back();

}else{

window.location.href=
"watch.html";

}

}


loadMovie();

</script>

</body>

</html>
