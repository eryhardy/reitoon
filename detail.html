<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08070d">
<title>Detail Film - Reitoon</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--bg:#08070d;
--surface:#191722;
--surface2:#211f2b;
--text:#fff;
--muted:#aaa3b0;
--pink:#ff2f8d;
--purple:#762dff;
--border:rgba(255,255,255,.1);
}

body{
min-height:100vh;
background:
radial-gradient(circle at 100% 0%,rgba(255,40,145,.14),transparent 35%),
radial-gradient(circle at 0% 30%,rgba(112,45,255,.1),transparent 30%),
var(--bg);
color:#fff;
font-family:Arial,Helvetica,sans-serif;
padding-bottom:100px;
}

.header{
height:76px;
display:flex;
align-items:center;
padding:16px 20px;
background:rgba(8,7,13,.94);
border-bottom:1px solid var(--border);
position:sticky;
top:0;
z-index:20;
}

.back{
width:42px;
height:42px;
border-radius:14px;
border:1px solid var(--border);
background:var(--surface);
color:#fff;
font-size:20px;
}

.container{
max-width:600px;
margin:auto;
padding:20px 16px;
}

.video-box{
width:100%;
aspect-ratio:16/9;
border-radius:20px;
overflow:hidden;
background:#000;
border:1px solid var(--border);
}

.video-box video{
width:100%;
height:100%;
display:block;
}

.poster{
height:230px;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#ff2f8d,#762dff);
margin-bottom:20px;
}

.play-big{
width:65px;
height:65px;
border-radius:50%;
border:none;
font-size:25px;
cursor:pointer;
}

.title{
font-size:28px;
margin-top:20px;
}

.genre{
color:var(--pink);
font-size:13px;
margin-top:8px;
}

.description{
color:var(--muted);
font-size:14px;
line-height:1.6;
margin-top:15px;
}

.action-row{
display:flex;
gap:10px;
margin-top:20px;
}

.action{
flex:1;
padding:14px;
border-radius:13px;
border:1px solid var(--border);
background:var(--surface);
color:#fff;
font-weight:bold;
}

.action.primary{
border:none;
background:linear-gradient(135deg,var(--pink),var(--purple));
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:76px;
display:flex;
justify-content:space-around;
align-items:center;
background:rgba(14,13,21,.96);
border-top:1px solid var(--border);
}

.nav-item{
color:var(--muted);
text-decoration:none;
text-align:center;
font-size:10px;
}

.nav-icon{
display:block;
font-size:21px;
margin-bottom:4px;
}
</style>
</head>

<body>

<header class="header">
<button class="back" onclick="history.back()">←</button>
</header>

<main class="container">

<div class="poster" id="poster">
<button class="play-big" onclick="startVideo()">▶</button>
</div>

<div class="video-box" id="videoBox" style="display:none">

<video id="moviePlayer" controls playsinline>

<source src="" type="video/mp4">

Browser kamu tidak mendukung video.

</video>

</div>

<h1 class="title" id="movieTitle">Loading...</h1>

<p class="genre" id="movieGenre"></p>

<p class="description" id="movieDescription"></p>

<div class="action-row">

<button class="action primary" onclick="startVideo()">
▶ Tonton Sekarang
</button>

<button class="action" onclick="history.back()">
← Kembali
</button>

</div>

</main>

<nav class="bottom-nav">

<a class="nav-item" href="index.html">
<span class="nav-icon">🏠</span>
Home
</a>

<a class="nav-item active" href="watch.html">
<span class="nav-icon">▶️</span>
Watch
</a>

<a class="nav-item" href="create.html">
<span class="nav-icon">✨</span>
Create
</a>

<a class="nav-item" href="studio.html">
<span class="nav-icon">🎥</span>
Studio
</a>

<a class="nav-item" href="profile.html">
<span class="nav-icon">👤</span>
Profile
</a>

</nav>

<script>

const savedMovie=localStorage.getItem("reitoon_selected_movie");

let movie=savedMovie?JSON.parse(savedMovie):{
title:"Love Beyond Time",
genre:"Romance · Drama",
description:"Kisah cinta yang melampaui waktu.",
poster:"poster1"
};

document.getElementById("movieTitle").textContent=movie.title;
document.getElementById("movieGenre").textContent=movie.genre;
document.getElementById("movieDescription").textContent=movie.description;

function startVideo(){

document.getElementById("poster").style.display="none";

document.getElementById("videoBox").style.display="block";

const player=document.getElementById("moviePlayer");

player.play().catch(()=>{});

}

</script>

</body>
</html>
