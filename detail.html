<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08070d">
<title>Detail - Reitoon</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--bg:#08070d;
--surface:#191722;
--surface-light:#211f2b;
--muted:#aaa3b0;
--pink:#ff2f8d;
--purple:#762dff;
--border:rgba(255,255,255,.1)
}

body{
min-height:100vh;
background:
radial-gradient(circle at 100% 0%,rgba(255,40,145,.14),transparent 35%),
radial-gradient(circle at 0% 30%,rgba(112,45,255,.1),transparent 30%),
var(--bg);
color:#fff;
font-family:Arial,Helvetica,sans-serif;
padding-bottom:40px
}

.header{
height:76px;
display:flex;
align-items:center;
justify-content:space-between;
padding:16px 20px;
background:rgba(8,7,13,.94);
border-bottom:1px solid var(--border);
position:sticky;
top:0;
z-index:10
}

.back{
width:42px;
height:42px;
border-radius:14px;
border:1px solid var(--border);
background:var(--surface);
color:#fff;
font-size:20px
}

.logo{
font-size:29px;
font-weight:800;
background:linear-gradient(135deg,#fff,var(--pink),var(--purple));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent
}

.container{
max-width:600px;
margin:auto;
padding:20px 16px
}

.video{
width:100%;
aspect-ratio:16/9;
border-radius:18px;
overflow:hidden;
background:#000;
border:1px solid var(--border)
}

.video video{
width:100%;
height:100%;
display:block
}

.video-placeholder{
height:100%;
display:flex;
align-items:center;
justify-content:center;
font-size:55px;
background:
linear-gradient(135deg,#241329,#121124)
}

.cover{
width:100%;
height:260px;
object-fit:cover;
border-radius:18px;
margin-top:18px
}

.title{
font-size:26px;
margin-top:18px
}

.meta{
color:var(--pink);
font-size:13px;
margin-top:8px
}

.description{
color:var(--muted);
font-size:14px;
line-height:1.6;
margin-top:15px
}

.actions{
display:flex;
gap:10px;
margin-top:20px
}

.action{
flex:1;
padding:13px;
border-radius:12px;
border:1px solid var(--border);
background:var(--surface);
color:#fff;
font-weight:bold
}

.action.active{
background:linear-gradient(135deg,var(--pink),var(--purple));
border:none
}

.back-watch{
display:block;
margin-top:20px;
padding:14px;
border-radius:13px;
background:var(--surface);
border:1px solid var(--border);
color:#fff;
text-align:center;
text-decoration:none;
font-weight:bold
}
</style>
</head>

<body>

<header class="header">

<button class="back" onclick="history.back()">
←
</button>

<div class="logo">Reitoon</div>

<div style="width:42px"></div>

</header>

<main class="container">

<section class="video">

<video
id="videoPlayer"
controls
poster=""
>
<source src="" type="video/mp4">
Browser kamu tidak mendukung video.
</video>

<div id="videoPlaceholder" class="video-placeholder">
🎬
</div>

</section>

<img id="cover" class="cover">

<h1 id="title" class="title">
Loading...
</h1>

<p id="meta" class="meta"></p>

<p id="description" class="description"></p>

<div class="actions">

<button class="action" onclick="likeStory()">
❤️ Like
</button>

<button class="action" onclick="bookmarkStory()">
🔖 Save
</button>

</div>

<a class="back-watch" href="watch.html">
← Kembali ke Watch
</a>

</main>

<script>

const params=
new URLSearchParams(window.location.search);

const id=params.get("id");

const defaultMovies=[

{
id:"love-beyond-time",
title:"Love Beyond Time",
genre:"Romance",
description:"Sebuah kisah cinta yang melampaui waktu.",
cover:"",
type:"Film"
},

{
id:"last-kingdom",
title:"The Last Kingdom",
genre:"Action",
description:"Pertarungan besar demi masa depan kerajaan.",
cover:"",
type:"Film"
},

{
id:"hidden-truth",
title:"Hidden Truth",
genre:"Drama",
description:"Sebuah rahasia besar perlahan terungkap.",
cover:"",
type:"Film"
}

];

function findMovie(){

const saved=
localStorage.getItem("reitoon_story");

if(saved){

const story=JSON.parse(saved);

if(String(story.id)===String(id)){

return story;

}

}

return defaultMovies.find(
movie=>movie.id===id
);

}

const movie=findMovie();

if(movie){

document.getElementById("title")
.textContent=movie.title;

document.getElementById("meta")
.textContent=
movie.genre+" • "+movie.type;

document.getElementById("description")
.textContent=
movie.description;

if(movie.cover){

const cover=
document.getElementById("cover");

cover.src=movie.cover;

}else{

document.getElementById("cover")
.style.display="none";

}

}else{

document.getElementById("title")
.textContent="Film tidak ditemukan";

document.getElementById("description")
.textContent=
"Film atau cerita ini tidak tersedia.";

}

function likeStory(){

alert("❤️ Kamu menyukai cerita ini!");

}

function bookmarkStory(){

alert("🔖 Cerita disimpan ke koleksi kamu!");

}

</script>

</body>
</html>
