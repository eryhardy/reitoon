align-items:center;

.player video{

height:100%;

.player-empty{

.player-icon{

.action-grid{

grid-template-columns:
repeat(2,1fr);

}

color:#ffffff;

font-weight:bold;

font-size:12px;

cursor:pointer;
}

.action-button.primary{
border:none;

background:
linear-gradient(
135deg,
var(--pink),
var(--purple)
);
}

.episode-list{
display:grid;

grid-template-columns:
repeat(4,1fr);

gap:8px;
}

.episode-button{
padding:12px 5px;

border-radius:10px;

border:1px solid var(--border);

background:var(--surface-light);

color:#ffffff;

font-size:11px;

cursor:pointer;
}

.episode-button.active{
background:
linear-gradient(
135deg,
var(--pink),
var(--purple)
);

border:none;
}

.notice{
padding:14px;

border-radius:12px;

background:
rgba(255,211,90,.08);

border:1px solid
rgba(255,211,90,.2);

color:#ffe6a0;

font-size:11px;

line-height:1.6;
}

.bottom-nav{
position:fixed;

bottom:0;

left:0;

right:0;

height:76px;

display:flex;

justify-content:space-around;

align-items:center;

background:rgba(14,13,21,.96);

backdrop-filter:blur(18px);

border-top:1px solid var(--border);

z-index:30;
}

.nav-item{
color:var(--muted);

text-decoration:none;

text-align:center;

font-size:10px;

min-width:60px;
}

.nav-icon{
display:block;

font-size:21px;

margin-bottom:4px;
}

.nav-item.active{
color:var(--pink);
}

@media(max-width:600px){

.detail-hero{
grid-template-columns:1fr;
}

.poster{
min-height:220px;
}

.title{
font-size:24px;
}

.episode-list{
grid-template-columns:
repeat(4,1fr);
}

}

/* =====================================
   DATA DRAMA REITOON
===================================== */

const TOTAL_VIDEOS = 500;

const categories = [

"romance",

"fantasy",

"wuxia",

"historical",

"modern"

];

const icons = [

"❤️",

"✨",

"⚔️",

"🏯",

"🌸",

"🔥",

"🌙",

"💫",

"🐉",

"👑"

];


/* =====================================
   VIDEO RESMI / LEGAL
===================================== */

const legalVideos = [

/*

Masukkan video yang memang:

- Milik Reitoon
- Milik kamu
- Public Domain
- CC0
- Memiliki lisensi
- Memiliki izin redistribusi

Contoh:

{
id:"legal-001",
title:"Judul Drama",
category:"romance",
type:"licensed",
year:"2026",
episodes:"Episode 1",
rating:"⭐ 8.5",
icon:"❤️",
description:"Deskripsi drama",
videoUrl:"URL_VIDEO_RESMI",
license:"Lisensi resmi"
}

*/

];


/* =====================================
   KATALOG 500 DRAMA
===================================== */

const generatedCatalog = [];

for(

let i = 1;

i <= TOTAL_VIDEOS;

i++

){

const category =

categories[

(i - 1)

%

categories.length

];

generatedCatalog.push({

id:

"reitoon-" +

String(i)

.padStart(3,"0"),

title:

"Chinese Drama Collection " +

String(i)

.padStart(3,"0"),

category:

category,

type:

"free",

year:

"Legal Catalog",

episodes:

"Video",

rating:

"⭐ " +

(

8 +

((i % 20) / 10)

)

.toFixed(1),

icon:

icons[

(i - 1)

%

icons.length

],

description:

"Drama Asia dalam katalog Reitoon. Konten hanya dapat ditayangkan apabila memiliki hak penggunaan atau izin redistribusi yang sesuai.",

videoUrl:

"",

license:

"Belum diverifikasi"

});

}

const dramas = [

...legalVideos,

...generatedCatalog

];


/* =====================================
   AMBIL ID DRAMA DARI URL
===================================== */

const params =

new URLSearchParams(

window.location.search

);

const dramaId =

params.get("id");


const drama =

dramas.find(function(item){

return item.id === dramaId;

});


/* =====================================
   LOAD DETAIL DRAMA
===================================== */

function loadDrama(){

if(!drama){

document

.getElementById(

"dramaTitle"

)

.textContent =

"Drama Tidak Ditemukan";

document

.getElementById(

"dramaMeta"

)

.textContent =

"ID drama tidak valid.";

document

.getElementById(

"dramaDescription"

)

.textContent =

"Data drama tidak ditemukan.";

document

.getElementById(

"poster"

)

.textContent =

"😔";

return;

}

document

.getElementById(

"dramaTitle"

)

.textContent =

drama.title;

document

.getElementById(

"dramaMeta"

)

.textContent =

drama.year +

" • " +

drama.category +

" • " +

drama.episodes +

" • " +

drama.rating;

document

.getElementById(

"dramaDescription"

)

.textContent =

drama.description;

document

.getElementById(

"poster"

)

.textContent =

drama.icon;

const badge =

document

.getElementById(

"statusBadge"

);

if(

drama.type ===

"free"

){

badge.textContent =

"🆓 GRATIS";

badge.className =

"badge free";

}

else{

badge.textContent =

"📜 BERLISENSI";

badge.className =

"badge licensed";

}

loadPlayer();

loadEpisodes();

}


/* =====================================
   PLAYER
===================================== */

function loadPlayer(){

const player =

document

.getElementById(

"player"

);

if(

drama.videoUrl &&

drama.videoUrl.trim() !== ""

){

player.innerHTML = `

<video
controls
playsinline
preload="metadata"
>

<source
src="${drama.videoUrl}"
>

Browser kamu tidak mendukung video.

</video>

`;

}

else{

player.innerHTML = `

<div
class="player-empty"
>

<div
class="player-icon"
>
🔒
</div>

<div>
Video belum tersedia.
</div>

<br>

<small>
Sumber video legal belum ditambahkan.
</small>

</div>

`;

}

}


/* =====================================
   EPISODE
===================================== */

function loadEpisodes(){

const list =

document

.getElementById(

"episodeList"

);

if(!drama){

return;

}

let episodeCount = 1;

if(

drama.episodes !==

"Video"

){

const found =

drama.episodes.match(/\d+/);

if(found){

episodeCount =

Number(found[0]);

}

}

let html = "";

for(

let i = 1;

i <= episodeCount;

i++

){

html += `

<button
class="episode-button ${i === 1 ? "active" : ""}"
onclick="selectEpisode(this,${i})"
>

Episode ${i}

</button>

`;

}

list.innerHTML = html;

}


function selectEpisode(

button,

episode

){

document

.querySelectorAll(

".episode-button"

)

.forEach(function(item){

item.classList.remove(

"active"

);

});

button.classList.add(

"active"

);

}


/* =====================================
   TONTON SEKARANG
===================================== */

function startWatch(){

if(!drama){

return;

}

if(

!drama.videoUrl ||

drama.videoUrl.trim() === ""

){

alert(

"Video ini belum tersedia karena sumber video legal belum ditambahkan."

);

return;

}

const player =

document

.getElementById(

"player"

);

player.scrollIntoView({

behavior:

"smooth"

});

const video =

player.querySelector(

"video"

);

if(video){

video.play()

.catch(function(){});

}

}


/* =====================================
   BAGIKAN
===================================== */

function shareDrama(){

if(!drama){

return;

}

if(

navigator.share

){

navigator.share({

title:

drama.title,

text:

"Tonton " +

drama.title +

" di Reitoon",

url:

window.location.href

});

}

else if(

navigator.clipboard

){

navigator.clipboard.writeText(

window.location.href

)

.then(function(){

alert(

"Link berhasil disalin."

);

})

.catch(function(){

alert(

"Salin link ini: " +

window.location.href

);

});

}

else{

alert(

"Link drama: " +

window.location.href

);

}

}


/* =====================================
   KEMBALI
===================================== */

function goBack(){

if(

document.referrer

){

history.back();

}

else{

window.location.href =

"watch.html";

}

}


/* =====================================
   JALANKAN
===================================== */

loadDrama();

</script></body>
