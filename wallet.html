<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#08070d"
  >

  <title>Wallet - Reitoon</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    .wallet-balance {

      padding: 24px;

      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          #ff2f8d,
          #762dff
        );

      margin-bottom: 16px;

    }

    .wallet-balance small {

      opacity: .8;

    }

    .wallet-balance h1 {

      font-size: 30px;

      margin-top: 8px;

    }

    .credit-card {

      padding: 20px;

      border-radius: 20px;

      background: var(--surface);

      border: 1px solid var(--border);

      margin-bottom: 18px;

    }

    .credit-number {

      font-size: 28px;

      font-weight: bold;

      color: var(--pink);

    }

    .package-grid {

      display: grid;

      grid-template-columns: repeat(2,1fr);

      gap: 10px;

      margin-top: 15px;

    }

    .package {

      padding: 15px;

      border-radius: 15px;

      border: 1px solid var(--border);

      background: var(--surface-light);

      color: white;

      text-align: left;

    }

    .package strong {

      display: block;

      font-size: 16px;

    }

    .package span {

      display: block;

      color: var(--muted);

      font-size: 12px;

      margin-top: 5px;

    }

    .payment-list {

      display: grid;

      gap: 10px;

      margin-top: 15px;

    }

    .payment-button {

      padding: 15px;

      border-radius: 13px;

      border: 1px solid var(--border);

      background: var(--surface-light);

      color: white;

      text-align: left;

    }

  </style>

</head>

<body>

  <header class="top-header">

    <button
      class="back-button"
      onclick="history.back()"
    >
      ←
    </button>

    <div class="brand-name">
      Reitoon
    </div>

    <div style="width:42px;"></div>

  </header>


  <main class="container">

    <span class="section-label">
      REITOON WALLET
    </span>

    <h1 style="font-size:30px;margin-top:8px;">
      My Wallet
    </h1>


    <section class="wallet-balance">

      <small>
        Saldo Penghasilan
      </small>

      <h1 id="balance">
        Rp0
      </h1>

    </section>


    <section class="credit-card">

      <p style="color:#aaa3b0;font-size:13px;">
        AI Credit
      </p>

      <div
        class="credit-number"
        id="credits"
      >
        0
      </div>

      <p style="color:#aaa3b0;font-size:12px;margin-top:6px;">
        Gunakan untuk fitur AI Reitoon.
      </p>

    </section>


    <section class="form-card">

      <h2>
        💳 Top Up AI Credit
      </h2>

      <p style="color:#aaa3b0;font-size:12px;margin-top:7px;">
        Prototype pembayaran Reitoon.
      </p>


      <div class="package-grid">

        <button
          class="package"
          onclick="topUp(100,20000)"
        >

          <strong>
            100 Credit
          </strong>

          <span>
            Rp20.000
          </span>

        </button>


        <button
          class="package"
          onclick="topUp(500,85000)"
        >

          <strong>
            500 Credit
          </strong>

          <span>
            Rp85.000
          </span>

        </button>


        <button
          class="package"
          onclick="topUp(1000,150000)"
        >

          <strong>
            1.000 Credit
          </strong>

          <span>
            Rp150.000
          </span>

        </button>


        <button
          class="package"
          onclick="topUp(5000,650000)"
        >

          <strong>
            5.000 Credit
          </strong>

          <span>
            Rp650.000
          </span>

        </button>

      </div>

    </section>


    <section class="form-card">

      <h2>
        🏦 Metode Pembayaran
      </h2>

      <div class="payment-list">

        <button
          class="payment-button"
          onclick="payment('Bank Indonesia')"
        >
          🏦 Bank / Virtual Account
        </button>

        <button
          class="payment-button"
          onclick="payment('QRIS')"
        >
          📱 QRIS
        </button>

        <button
          class="payment-button"
          onclick="payment('E-Wallet')"
        >
          💳 E-Wallet
        </button>

        <button
          class="payment-button"
          onclick="payment('Indomaret / Alfamart')"
        >
          🏪 Indomaret / Alfamart
        </button>

        <button
          class="payment-button"
          onclick="payment('Kartu Kredit')"
        >
          💳 Kartu Kredit / Debit
        </button>

      </div>

    </section>


    <section class="form-card">

      <h2>
        💸 Penarikan Penghasilan
      </h2>

      <p style="color:#aaa3b0;font-size:13px;margin-top:8px;line-height:1.6;">

        Minimum penarikan saldo adalah
        <strong style="color:white;">
          Rp100.000
        </strong>.

      </p>

      <button
        class="primary-button"
        style="margin-top:15px;"
        onclick="withdraw()"
      >

        💸 Tarik Saldo

      </button>

    </section>

  </main>


  <nav class="bottom-navigation">

    <a class="nav-item" href="index.html">
      <span class="nav-icon">🏠</span>
      Home
    </a>

    <a class="nav-item" href="watch.html">
      <span class="nav-icon">▶️</span>
      Watch
    </a>

    <a class="nav-item" href="create.html">
      <span class="nav-icon">✨</span>
      Create
    </a>

    <a class="nav-item" href="studio.html">
      <span class="nav-icon">🎥</span>
      Studio
    </a>

    <a class="nav-item" href="profile.html">
      <span class="nav-icon">👤</span>
      Profile
    </a>

  </nav>


  <script>

    let credits =
      Number(
        localStorage.getItem(
          "reitoon_credits"
        )
      ) || 0;


    let balance =
      Number(
        localStorage.getItem(
          "reitoon_balance"
        )
      ) || 0;


    function formatRupiah(number) {

      return new Intl.NumberFormat(
        "id-ID",
        {
          style: "currency",
          currency: "IDR",
          maximumFractionDigits: 0
        }
      ).format(number);

    }


    function loadWallet() {

      document
        .getElementById("credits")
        .textContent =
          credits.toLocaleString("id-ID");


      document
        .getElementById("balance")
        .textContent =
          formatRupiah(balance);

    }


    function topUp(amount, price) {

      alert(
        "Prototype: lanjut ke pembayaran " +
        formatRupiah(price)
      );


      credits += amount;


      localStorage.setItem(
        "reitoon_credits",
        credits
      );


      loadWallet();

    }


    function payment(method) {

      alert(
        "Metode pembayaran dipilih: " +
        method
      );

    }


    function withdraw() {

      if (balance < 100000) {

        alert(
          "Minimum penarikan adalah Rp100.000"
        );

        return;

      }

      alert(
        "Permintaan penarikan dibuat."
      );

    }


    loadWallet();

  </script>

</body>
</html>
