<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#08070d"
  >

  <title>Edit Profile - Reitoon</title>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #08070d;
      --surface: #15141d;
      --surface-light: #211f2b;
      --text: #ffffff;
      --muted: #aaa3b0;
      --pink: #ff2f8d;
      --purple: #762dff;
      --border: rgba(255,255,255,0.10);
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(255,40,145,0.14),
          transparent 35%
        ),
        radial-gradient(
          circle at 0% 30%,
          rgba(112,45,255,0.10),
          transparent 30%
        ),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      padding-bottom: 40px;
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 600px;
      margin: auto;
    }

    /* HEADER */

    .header {
      height: 76px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(8,7,13,0.94);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .back-button {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .header-title {
      font-size: 18px;
      font-weight: bold;
    }

    .header-space {
      width: 42px;
    }

    /* CONTENT */

    .container {
      padding: 28px 18px;
    }

    .page-title {
      font-size: 29px;
      margin-bottom: 7px;
    }

    .page-subtitle {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    /* AVATAR */

    .avatar-section {
      text-align: center;
      margin-bottom: 28px;
    }

    .avatar-wrapper {
      position: relative;
      width: 105px;
      height: 105px;
      margin: auto;
    }

    .avatar {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: bold;
      color: white;
      background:
        linear-gradient(
          135deg,
          var(--pink),
          var(--purple)
        );
      border: 4px solid rgba(255,255,255,0.10);
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-button {
      position: absolute;
      right: -3px;
      bottom: 0;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid var(--bg);
      background: var(--pink);
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    #avatarInput {
      display: none;
    }

    .avatar-hint {
      color: var(--muted);
      font-size: 11px;
      margin-top: 10px;
    }

    /* FORM */

    .form-card {
      padding: 20px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .form-group {
      margin-bottom: 19px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      border-radius: 13px;
      border: 1px solid var(--border);
      outline: none;
      background: #100f17;
      color: white;
      font-family: inherit;
      font-size: 14px;
    }

    input:focus,
    textarea:focus {
      border-color: var(--pink);
      box-shadow:
        0 0 0 3px rgba(255,47,141,0.08);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .username-wrapper {
      display: flex;
      align-items: center;
      background: #100f17;
      border: 1px solid var(--border);
      border-radius: 13px;
      overflow: hidden;
    }

    .username-prefix {
      padding-left: 14px;
      color: var(--pink);
      font-size: 14px;
    }

    .username-wrapper input {
      border: none;
      border-radius: 0;
      background: transparent;
    }

    .username-wrapper:focus-within {
      border-color: var(--pink);
      box-shadow:
        0 0 0 3px rgba(255,47,141,0.08);
    }

    .counter {
      color: var(--muted);
      text-align: right;
      font-size: 10px;
      margin-top: 5px;
    }

    /* SAVE */

    .save-button {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background:
        linear-gradient(
          135deg,
          var(--pink),
          var(--purple)
        );
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow:
        0 10px 25px rgba(255,47,141,0.20);
    }

    .save-button:active {
      transform: scale(0.98);
    }

    /* DANGER */

    .danger-section {
      margin-top: 22px;
      padding: 18px;
      border-radius: 18px;
      border: 1px solid rgba(255,80,110,0.18);
      background: rgba(255,50,80,0.05);
    }

    .danger-section h3 {
      font-size: 14px;
      color: #ff6b8a;
      margin-bottom: 6px;
    }

    .danger-section p {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .reset-button {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,80,110,0.30);
      background: transparent;
      color: #ff6b8a;
      font-size: 11px;
      cursor: pointer;
    }

    /* TOAST */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%) translateY(20px);
      padding: 13px 17px;
      border-radius: 12px;
      background: var(--surface-light);
      border: 1px solid var(--border);
      color: white;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: 0.3s;
      z-index: 50;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 420px) {

      .container {
        padding-left: 14px;
        padding-right: 14px;
      }

      .form-card {
        padding: 17px;
      }

    }

  </style>

</head>


<body>


  <div class="app">


    <!-- HEADER -->

    <header class="header">

      <button
        class="back-button"
        onclick="goBack()"
      >

        ←

      </button>


      <div class="header-title">

        Edit Profile

      </div>


      <div class="header-space"></div>

    </header>


    <!-- CONTENT -->

    <main class="container">


      <h1 class="page-title">

        Edit Your Profile

      </h1>


      <p class="page-subtitle">

        Atur identitas creator kamu di Reitoon.

      </p>


      <!-- AVATAR -->

      <section class="avatar-section">


        <div class="avatar-wrapper">


          <div
            class="avatar"
            id="avatar"
          >

            R

          </div>


          <button
            class="camera-button"
            onclick="document.getElementById('avatarInput').click()"
          >

            📷

          </button>


          <input
            type="file"
            id="avatarInput"
            accept="image/*"
            onchange="previewAvatar(event)"
          >

        </div>


        <p class="avatar-hint">

          Tekan kamera untuk mengganti foto profil

        </p>


      </section>


      <!-- FORM -->

      <section class="form-card">


        <div class="form-group">

          <label>

            Nama Creator

          </label>


          <input
            type="text"
            id="nameInput"
            maxlength="30"
            placeholder="Masukkan nama creator"
          >

        </div>


        <div class="form-group">

          <label>

            Username

          </label>


          <div class="username-wrapper">

            <span class="username-prefix">

              @

            </span>


            <input
              type="text"
              id="usernameInput"
              maxlength="20"
              placeholder="username"
            >

          </div>

        </div>


        <div class="form-group">

          <label>

            Bio

          </label>


          <textarea
            id="bioInput"
            maxlength="120"
            placeholder="Ceritakan sedikit tentang kamu..."
            oninput="updateCounter()"
          ></textarea>


          <div
            class="counter"
            id="bioCounter"
          >

            0 / 120

          </div>

        </div>


        <button
          class="save-button"
          onclick="saveProfile()"
        >

          💾 Save Changes

        </button>


      </section>


      <!-- DANGER -->

      <section class="danger-section">


        <h3>

          ⚠️ Reset Profile

        </h3>


        <p>

          Hapus data profil yang tersimpan di perangkat ini dan kembali ke profil default.

        </p>


        <button
          class="reset-button"
          onclick="resetProfile()"
        >

          Reset Profile

        </button>


      </section>


    </main>


  </div>


  <!-- TOAST -->

  <div
    class="toast"
    id="toast"
  ></div>


  <script>


    let avatarData = "";


    /* LOAD PROFILE */

    function loadProfile() {


      const savedProfile =

        localStorage.getItem(
          "reitoon_profile"
        );


      if (!savedProfile) {


        document
          .getElementById("nameInput")
          .value =
          "Reitoon Creator";


        document
          .getElementById("usernameInput")
          .value =
          "creator";


        document
          .getElementById("bioInput")
          .value =
          "Creator cerita dan dunia baru di Reitoon ✨";


        updateCounter();


        return;

      }


      const profile =

        JSON.parse(savedProfile);


      document
        .getElementById("nameInput")
        .value =
        profile.name || "Reitoon Creator";


      document
        .getElementById("usernameInput")
        .value =
        profile.username || "creator";


      document
        .getElementById("bioInput")
        .value =
        profile.bio ||

        "Creator cerita dan dunia baru di Reitoon ✨";


      if (profile.avatar) {

        avatarData =
          profile.avatar;


        document
          .getElementById("avatar")
          .innerHTML =

          `<img src="${profile.avatar}" alt="Avatar">`;

      } else {

        updateAvatarLetter();

      }


      updateCounter();

    }


    /* AVATAR PREVIEW */

    function previewAvatar(event) {


      const file =

        event.target.files[0];


      if (!file) {

        return;

      }


      const reader =

        new FileReader();


      reader.onload =

        function(e) {


          avatarData =
            e.target.result;


          document
            .getElementById("avatar")
            .innerHTML =

            `<img src="${avatarData}" alt="Avatar">`;

        };


      reader.readAsDataURL(file);

    }


    /* UPDATE LETTER */

    function updateAvatarLetter() {


      const name =

        document
        .getElementById("nameInput")
        .value
        .trim();


      const letter =

        name ?

        name
        .charAt(0)
        .toUpperCase() :

        "R";


      document
        .getElementById("avatar")
        .textContent =
        letter;

    }


    /* COUNTER */

    function updateCounter() {


      const bio =

        document
        .getElementById("bioInput")
        .value;


      document
        .getElementById("bioCounter")
        .textContent =

        bio.length +

        " / 120";

    }


    /* SAVE */

    function saveProfile() {


      const name =

        document
        .getElementById("nameInput")
        .value
        .trim();


      const username =

        document
        .getElementById("usernameInput")
        .value
        .trim()
        .replace(
          /^@/,
          ""
        );


      const bio =

        document
        .getElementById("bioInput")
        .value
        .trim();


      if (!name) {

        showToast(
          "Masukkan nama creator"
        );

        return;

      }


      if (!username) {

        showToast(
          "Masukkan username"
        );

        return;

      }


      if (!bio) {

        showToast(
          "Masukkan bio creator"
        );

        return;

      }


      const profileData = {


        name: name,

        username: username,

        bio: bio,

        avatar: avatarData

      };


      localStorage.setItem(

        "reitoon_profile",

        JSON.stringify(
          profileData
        )

      );


      showToast(

        "✅ Profile berhasil disimpan"

      );


      setTimeout(

        function() {

          window.location.href =
            "profile.html";

        },

        1200

      );

    }


    /* RESET */

    function resetProfile() {


      const confirmReset =

        confirm(

          "Reset profile ke data default?"

        );


      if (!confirmReset) {

        return;

      }


      localStorage.removeItem(

        "reitoon_profile"

      );


      showToast(

        "Profile berhasil direset"

      );


      setTimeout(

        function() {

          location.reload();

        },

        1000

      );

    }


    /* BACK */

    function goBack() {


      window.location.href =
        "profile.html";

    }


    /* TOAST */

    function showToast(

      message

    ) {


      const toast =

        document
        .getElementById("toast");


      toast.textContent =
        message;


      toast.classList.add(
        "show"
      );


      setTimeout(

        function() {

          toast.classList.remove(
            "show"
          );

        },

        2500

      );

    }


    /* INIT */

    loadProfile();


    document
      .getElementById("nameInput")
      .addEventListener(
        "input",
        function() {

          if (!avatarData) {

            updateAvatarLetter();

          }

        }

      );

  </script>


</body>

</html>
