<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08070d">
<title>Create - Reitoon</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--bg:#08070d;
--surface:#191722;
--surface-light:#211f2b;
--text:#fff;
--muted:#aaa3b0;
--pink:#ff2f8d;
--purple:#762dff;
--border:rgba(255,255,255,.1)
}

body{
min-height:100vh;
background:
radial-gradient(circle at 100% 0%,rgba(255,40,145,.14),transparent 35%),
radial-gradient(circle at 0% 30%,rgba(112,45,255,.1),transparent 30%),
var(--bg);
color:var(--text);
font-family:Arial,Helvetica,sans-serif;
padding-bottom:100px
}

.header{
height:76px;
display:flex;
align-items:center;
justify-content:space-between;
padding:16px 20px;
background:rgba(8,7,13,.94);
border-bottom:1px solid var(--border);
position:sticky;
top:0;
z-index:10
}

.back{
width:42px;
height:42px;
border-radius:14px;
border:1px solid var(--border);
background:var(--surface);
color:#fff;
font-size:20px
}

.logo{
font-size:29px;
font-weight:800;
background:linear-gradient(135deg,#fff,var(--pink),var(--purple));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent
}

.container{
width:100%;
max-width:600px;
margin:auto;
padding:28px 16px
}

.title{font-size:30px}
.title span{
background:linear-gradient(135deg,var(--pink),var(--purple));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent
}

.subtitle{
color:var(--muted);
font-size:14px;
line-height:1.5;
margin-top:8px
}

.types{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin-top:22px
}

.type{
padding:18px;
border-radius:18px;
background:var(--surface);
border:1px solid var(--border);
cursor:pointer
}

.type.active{
border-color:var(--pink);
background:linear-gradient(135deg,rgba(255,47,141,.15),rgba(118,45,255,.12)),var(--surface)
}

.type-icon{font-size:28px;margin-bottom:10px}
.type h3{font-size:15px}
.type p{
color:var(--muted);
font-size:11px;
line-height:1.4;
margin-top:5px
}

.form{
margin-top:20px;
padding:20px;
border-radius:20px;
background:var(--surface);
border:1px solid var(--border)
}

.group{margin-bottom:17px}
label{
display:block;
font-size:12px;
font-weight:bold;
margin-bottom:7px
}

input,textarea,select{
width:100%;
padding:13px;
border-radius:12px;
border:1px solid var(--border);
background:#100f17;
color:#fff;
outline:none;
font-family:inherit
}

textarea{
height:110px;
resize:vertical
}

input:focus,textarea:focus,select:focus{
border-color:var(--pink)
}

.upload{
padding:25px;
text-align:center;
border:1px dashed rgba(255,255,255,.25);
border-radius:16px;
cursor:pointer
}

.upload-icon{font-size:35px}
.upload p{
color:var(--muted);
font-size:11px;
margin-top:7px
}

.preview{
display:none;
width:100%;
max-height:220px;
object-fit:cover;
border-radius:14px;
margin-top:12px
}

button.create{
width:100%;
padding:15px;
border:none;
border-radius:13px;
color:#fff;
font-weight:bold;
background:linear-gradient(135deg,var(--pink),var(--purple));
cursor:pointer
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:76px;
display:flex;
justify-content:space-around;
align-items:center;
background:rgba(14,13,21,.96);
border-top:1px solid var(--border);
z-index:20
}

.nav{
color:var(--muted);
text-decoration:none;
text-align:center;
font-size:10px
}

.nav-icon{
display:block;
font-size:21px;
margin-bottom:4px
}

.nav.active{color:var(--pink)}

.toast{
position:fixed;
left:50%;
bottom:95px;
transform:translateX(-50%) translateY(20px);
background:var(--surface-light);
border:1px solid var(--border);
border-radius:14px;
padding:13px 18px;
font-size:13px;
opacity:0;
pointer-events:none;
transition:.3s;
z-index:50;
white-space:nowrap
}

.toast.show{
opacity:1;
transform:translateX(-50%) translateY(0)
}

@media(max-width:600px){
.types{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header class="header">
<button class="back" onclick="history.back()">←</button>
<div class="logo">Reitoon</div>
<div style="width:42px"></div>
</header>

<main class="container">

<h1 class="title">
Create <span>Your Story</span>
</h1>

<p class="subtitle">
Buat cerita original dan publikasikan ke dunia Reitoon.
</p>

<section class="types">

<div class="type active" onclick="selectType(this,'Film')">
<div class="type-icon">🎬</div>
<h3>Create Film</h3>
<p>Buat film dan cerita visual.</p>
</div>

<div class="type" onclick="selectType(this,'Story')">
<div class="type-icon">✍️</div>
<h3>Create Story</h3>
<p>Tulis cerita original kamu.</p>
</div>

</section>

<section class="form">

<div class="group">
<label>Judul Cerita</label>
<input id="title" placeholder="Contoh: Love Beyond Time">
</div>

<div class="group">
<label>Genre</label>
<select id="genre">
<option value="">Pilih Genre</option>
<option>Romance</option>
<option>Drama</option>
<option>Action</option>
<option>Fantasy</option>
<option>Comedy</option>
<option>Thriller</option>
</select>
</div>

<div class="group">
<label>Deskripsi Cerita</label>
<textarea id="description" placeholder="Ceritakan tentang cerita kamu..."></textarea>
</div>

<div class="group">
<label>Cover Cerita</label>

<label class="upload">
<div class="upload-icon">🖼️</div>
<strong>Upload Cover</strong>
<p>JPG atau PNG</p>

<input
type="file"
id="cover"
accept="image/*"
hidden
onchange="previewCover(event)"
>

</label>

<img id="preview" class="preview">
</div>

<div class="group">
<label>Status</label>

<select id="status">
<option value="draft">Simpan sebagai Draft</option>
<option value="public">Publikasikan ke Watch</option>
</select>
</div>

<button class="create" onclick="saveStory()">
🚀 Simpan Cerita
</button>

</section>

</main>

<nav class="bottom-nav">

<a class="nav" href="index.html">
<span class="nav-icon">🏠</span>
Home
</a>

<a class="nav" href="watch.html">
<span class="nav-icon">▶️</span>
Watch
</a>

<a class="nav active" href="create.html">
<span class="nav-icon">✨</span>
Create
</a>

<a class="nav" href="studio.html">
<span class="nav-icon">🎥</span>
Studio
</a>

<a class="nav" href="profile.html">
<span class="nav-icon">👤</span>
Profile
</a>

</nav>

<div class="toast" id="toast"></div>

<script>

let selectedType="Film";

function selectType(element,type){

document.querySelectorAll(".type")
.forEach(x=>x.classList.remove("active"));

element.classList.add("active");

selectedType=type;
}

function previewCover(event){

const file=event.target.files[0];

if(!file)return;

const reader=new FileReader();

reader.onload=function(e){

const preview=document.getElementById("preview");

preview.src=e.target.result;
preview.style.display="block";

};

reader.readAsDataURL(file);
}

function saveStory(){

const title=document.getElementById("title").value.trim();
const genre=document.getElementById("genre").value;
const description=document.getElementById("description").value.trim();
const status=document.getElementById("status").value;
const cover=document.getElementById("preview").src;

if(!title){
showToast("Masukkan judul cerita");
return;
}

if(!genre){
showToast("Pilih genre");
return;
}

if(!description){
showToast("Masukkan deskripsi cerita");
return;
}

const story={

id:Date.now(),

type:selectedType,

title:title,

genre:genre,

description:description,

cover:cover || "",

status:status,

views:0,

likes:0,

createdAt:new Date().toISOString()

};

localStorage.setItem(
"reitoon_story",
JSON.stringify(story)
);

showToast(
status==="public"
?"🎉 Cerita berhasil dipublikasikan!"
:"💾 Cerita disimpan sebagai draft"
);

setTimeout(()=>{

window.location.href="studio.html";

},1200);

}

function showToast(message){

const toast=document.getElementById("toast");

toast.textContent=message;

toast.classList.add("show");

setTimeout(()=>{

toast.classList.remove("show");

},2500);

}

</script>

</body>
</html>
