<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08070d">
<title>Create - Reitoon</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

:root{
--bg:#08070d;
--surface:#191722;
--surface2:#211f2b;
--text:#fff;
--muted:#aaa3b0;
--pink:#ff2f8d;
--purple:#762dff;
--border:rgba(255,255,255,.1);
}

body{
min-height:100vh;
background:
radial-gradient(circle at 100% 0%,rgba(255,40,145,.14),transparent 35%),
radial-gradient(circle at 0% 30%,rgba(112,45,255,.1),transparent 30%),
var(--bg);
color:var(--text);
font-family:Arial,Helvetica,sans-serif;
padding-bottom:100px;
}

.header{
height:76px;
display:flex;
align-items:center;
justify-content:space-between;
padding:16px 20px;
background:rgba(8,7,13,.94);
border-bottom:1px solid var(--border);
position:sticky;
top:0;
z-index:20;
}

.back{
width:42px;
height:42px;
border-radius:14px;
border:1px solid var(--border);
background:var(--surface);
color:#fff;
font-size:20px;
cursor:pointer;
}

.logo{
font-size:29px;
font-weight:800;
background:linear-gradient(135deg,#fff,var(--pink),var(--purple));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.space{
width:42px;
}

.container{
max-width:600px;
margin:auto;
padding:25px 16px;
}

h1{
font-size:30px;
margin-bottom:8px;
}

h1 span{
background:linear-gradient(135deg,var(--pink),var(--purple));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.subtitle{
color:var(--muted);
font-size:14px;
line-height:1.5;
margin-bottom:25px;
}

.form-card{
padding:20px;
border-radius:22px;
background:var(--surface);
border:1px solid var(--border);
}

.form-group{
margin-bottom:18px;
}

label{
display:block;
font-size:13px;
font-weight:bold;
margin-bottom:8px;
}

input,
select,
textarea{
width:100%;
padding:14px;
border-radius:13px;
border:1px solid var(--border);
background:#100f17;
color:#fff;
outline:none;
font-size:14px;
font-family:Arial,Helvetica,sans-serif;
}

select{
appearance:auto;
}

textarea{
height:120px;
resize:none;
}

input:focus,
select:focus,
textarea:focus{
border-color:var(--pink);
}

.cover-box{
height:170px;
border:1px dashed rgba(255,255,255,.25);
border-radius:16px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:var(--muted);
margin-bottom:18px;
overflow:hidden;
position:relative;
}

.cover-box img{
width:100%;
height:100%;
object-fit:cover;
display:none;
}

.cover-box span{
font-size:13px;
}

.cover-input{
margin-top:10px;
}

.create-button{
width:100%;
padding:15px;
border:none;
border-radius:14px;
background:linear-gradient(135deg,var(--pink),var(--purple));
color:#fff;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

.cancel-button{
width:100%;
padding:14px;
margin-top:10px;
border:1px solid var(--border);
border-radius:14px;
background:var(--surface2);
color:#fff;
font-weight:bold;
cursor:pointer;
}

.toast{
position:fixed;
left:50%;
bottom:95px;
transform:translateX(-50%) translateY(20px);
padding:13px 18px;
border-radius:14px;
background:var(--surface2);
border:1px solid var(--border);
font-size:13px;
opacity:0;
pointer-events:none;
transition:.3s;
z-index:100;
white-space:nowrap;
}

.toast.show{
opacity:1;
transform:translateX(-50%) translateY(0);
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:76px;
display:flex;
justify-content:space-around;
align-items:center;
background:rgba(14,13,21,.96);
border-top:1px solid var(--border);
z-index:30;
}

.nav-item{
color:var(--muted);
text-decoration:none;
text-align:center;
font-size:10px;
min-width:60px;
}

.nav-icon{
display:block;
font-size:21px;
margin-bottom:4px;
}

.nav-item.active{
color:var(--pink);
}
</style>
</head>

<body>

<header class="header">

<button class="back" onclick="history.back()">←</button>

<div class="logo">
Reitoon
</div>

<div class="space"></div>

</header>

<main class="container">

<h1>Create <span>Story</span></h1>

<p class="subtitle">
Buat cerita dan film original kamu bersama Reitoon.
</p>

<div class="form-card">

<div class="form-group">

<label>Judul Film / Cerita</label>

<input
type="text"
id="title"
placeholder="Contoh: Love Beyond Time"
>

</div>

<div class="form-group">

<label>Genre</label>

<select id="genre">

<option value="">Pilih Genre</option>
<option>Romance</option>
<option>Drama</option>
<option>Action</option>
<option>Fantasy</option>
<option>Comedy</option>
<option>Horror</option>
<option>Mystery</option>

</select>

</div>

<div class="form-group">

<label>Deskripsi Cerita</label>

<textarea
id="description"
placeholder="Tuliskan sinopsis cerita kamu..."
></textarea>

</div>

<div class="form-group">

<label>Upload Cover Film</label>

<div class="cover-box">

<img id="coverPreview">

<span id="coverText">
🖼️ Pilih gambar cover film
</span>

</div>

<input
class="cover-input"
type="file"
id="coverInput"
accept="image/*"
>

</div>

<button
class="create-button"
onclick="saveStory()"
>

✨ Simpan Cerita

</button>

<button
class="cancel-button"
onclick="window.location.href='studio.html'"
>

🎬 Buka Studio

</button>

</div>

</main>

<nav class="bottom-nav">

<a class="nav-item" href="index.html">
<span class="nav-icon">🏠</span>
Home
</a>

<a class="nav-item" href="watch.html">
<span class="nav-icon">▶️</span>
Watch
</a>

<a class="nav-item active" href="create.html">
<span class="nav-icon">✨</span>
Create
</a>

<a class="nav-item" href="studio.html">
<span class="nav-icon">🎥</span>
Studio
</a>

<a class="nav-item" href="profile.html">
<span class="nav-icon">👤</span>
Profile
</a>

</nav>

<div class="toast" id="toast"></div>

<script>

let coverData="";

document
.getElementById("coverInput")
.addEventListener("change",function(event){

const file=event.target.files[0];

if(!file)return;

const reader=new FileReader();

reader.onload=function(e){

coverData=e.target.result;

const preview=document.getElementById("coverPreview");

preview.src=coverData;

preview.style.display="block";

document.getElementById("coverText").style.display="none";

};

reader.readAsDataURL(file);

});

function saveStory(){

const title=document
.getElementById("title")
.value
.trim();

const genre=document
.getElementById("genre")
.value;

const description=document
.getElementById("description")
.value
.trim();

if(!title){

showToast("⚠️ Judul cerita wajib diisi");

return;

}

if(!genre){

showToast("⚠️ Pilih genre cerita");

return;

}

if(!description){

showToast("⚠️ Deskripsi cerita wajib diisi");

return;

}

const story={

id:Date.now(),

title:title,

genre:genre,

description:description,

cover:coverData,

status:"DRAFT",

published:false,

createdAt:new Date().toLocaleDateString("id-ID")

};

localStorage.setItem(
"reitoon_story",
JSON.stringify(story)
);

showToast("✅ Cerita berhasil disimpan");

setTimeout(function(){

window.location.href="studio.html";

},1000);

}

function showToast(message){

const toast=document.getElementById("toast");

toast.textContent=message;

toast.classList.add("show");

setTimeout(function(){

toast.classList.remove("show");

},2500);

}

</script>

</body>
</html>
