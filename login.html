<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08070d">
  <title>Login - Reitoon</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at 100% 0%, rgba(255,40,145,.18), transparent 35%),
        radial-gradient(circle at 0% 100%, rgba(112,45,255,.16), transparent 35%),
        #08070d;
      color: white;
      font-family: Arial, sans-serif;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      padding: 28px 20px;
      border-radius: 25px;
      background: #191722;
      border: 1px solid rgba(255,255,255,.1);
    }

    .logo {
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      background: linear-gradient(135deg, white, #ff2f8d, #762dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: #aaa3b0;
      margin: 8px 0 25px;
      font-size: 13px;
    }

    .input {
      width: 100%;
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,.1);
      background: #100f17;
      color: white;
      outline: none;
    }

    .login-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #ff2f8d, #762dff);
      color: white;
      font-weight: bold;
      margin-top: 5px;
    }

    .divider {
      text-align: center;
      color: #aaa3b0;
      margin: 22px 0;
      font-size: 12px;
    }

    .social-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .social-button {
      padding: 13px 8px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.1);
      background: #211f2b;
      color: white;
    }

    .note {
      color: #77727f;
      text-align: center;
      font-size: 11px;
      line-height: 1.5;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <main class="login-box">

    <div class="logo">Reitoon</div>

    <p class="subtitle">
      Masuk dan mulai membuat cerita kamu
    </p>

    <input
      class="input"
      id="email"
      type="text"
      placeholder="Email atau nomor telepon"
    >

    <input
      class="input"
      id="password"
      type="password"
      placeholder="Password"
    >

    <button
      class="login-button"
      onclick="login()"
    >
      🔐 Login
    </button>

    <div class="divider">
      atau lanjutkan dengan
    </div>

    <div class="social-grid">

      <button class="social-button" onclick="socialLogin('Google')">
        Google
      </button>

      <button class="social-button" onclick="socialLogin('Facebook')">
        Facebook
      </button>

      <button class="social-button" onclick="socialLogin('TikTok')">
        TikTok
      </button>

      <button class="social-button" onclick="socialLogin('WhatsApp')">
        WhatsApp
      </button>

    </div>

    <p class="note">
      Prototype Reitoon. Login sosial asli membutuhkan integrasi OAuth resmi dan backend.
    </p>

  </main>

  <script>

    function login() {

      const email =
        document.getElementById("email").value.trim();

      if (!email) {

        alert("Masukkan email atau nomor telepon");

        return;

      }

      localStorage.setItem(
        "reitoon_logged_in",
        "true"
      );

      localStorage.setItem(
        "reitoon_login_user",
        email
      );

      window.location.href =
        "index.html";

    }


    function socialLogin(provider) {

      localStorage.setItem(
        "reitoon_logged_in",
        "true"
      );

      localStorage.setItem(
        "reitoon_login_user",
        provider + " User"
      );

      window.location.href =
        "index.html";

    }

  </script>

</body>
</html>
