<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#08070d"
  >

  <title>Profile - Reitoon</title>


  <style>

    /* RESET */

    * {

      margin: 0;

      padding: 0;

      box-sizing: border-box;

    }


    /* ROOT */

    :root {

      --bg: #08070d;

      --surface: #15141d;

      --surface-light: #211f2b;

      --text: #ffffff;

      --muted: #aaa3b0;

      --pink: #ff2f8d;

      --purple: #762dff;

      --border: rgba(255,255,255,0.10);

    }


    /* BODY */

    body {

      min-height: 100vh;

      background:

        radial-gradient(

          circle at 100% 0%,

          rgba(255,40,145,0.14),

          transparent 35%

        ),

        radial-gradient(

          circle at 0% 30%,

          rgba(112,45,255,0.10),

          transparent 30%

        ),

        var(--bg);

      color: var(--text);

      font-family:

        Arial,

        Helvetica,

        sans-serif;

      overflow-x: hidden;

      padding-bottom: 100px;

    }


    /* APP */

    .app {

      width: 100%;

      max-width: 600px;

      min-height: 100vh;

      margin: 0 auto;

    }


    /* HEADER */

    .header {

      height: 76px;

      padding: 16px 18px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      background: rgba(8,7,13,0.94);

      border-bottom: 1px solid var(--border);

      position: sticky;

      top: 0;

      z-index: 10;

    }


    .back-button {

      width: 42px;

      height: 42px;

      border-radius: 14px;

      border: 1px solid var(--border);

      background: var(--surface);

      color: white;

      font-size: 20px;

      cursor: pointer;

    }


    .header-title {

      font-size: 18px;

      font-weight: bold;

    }


    .header-space {

      width: 42px;

    }


    /* PROFILE HERO */

    .profile-hero {

      padding: 30px 20px 25px;

      text-align: center;

    }


    .avatar {

      width: 92px;

      height: 92px;

      margin: 0 auto 15px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 38px;

      font-weight: bold;

      color: white;

      background:

        linear-gradient(

          135deg,

          var(--pink),

          var(--purple)

        );

      border: 4px solid rgba(255,255,255,0.10);

      box-shadow:

        0 10px 35px rgba(255,47,141,0.25);

    }


    .profile-name {

      font-size: 24px;

      font-weight: bold;

    }


    .profile-username {

      color: var(--pink);

      font-size: 13px;

      margin-top: 5px;

    }


    .profile-bio {

      color: var(--muted);

      font-size: 13px;

      line-height: 1.5;

      max-width: 290px;

      margin: 12px auto 0;

    }


    .edit-profile-button {

      margin-top: 17px;

      padding: 11px 22px;

      border-radius: 12px;

      border: 1px solid var(--border);

      background: var(--surface);

      color: white;

      font-size: 12px;

      font-weight: bold;

      cursor: pointer;

    }


    /* STATS */

    .profile-stats {

      display: grid;

      grid-template-columns: repeat(3, 1fr);

      margin: 0 18px 25px;

      padding: 17px 8px;

      border-radius: 18px;

      background: var(--surface);

      border: 1px solid var(--border);

    }


    .stat {

      text-align: center;

      border-right: 1px solid var(--border);

    }


    .stat:last-child {

      border-right: none;

    }


    .stat strong {

      display: block;

      font-size: 20px;

    }


    .stat span {

      display: block;

      color: var(--muted);

      font-size: 10px;

      margin-top: 5px;

    }


    /* SECTION */

    .section {

      padding: 0 18px;

      margin-bottom: 25px;

    }


    .section-header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 13px;

    }


    .section-title {

      font-size: 18px;

    }


    .see-all {

      color: var(--pink);

      font-size: 11px;

      text-decoration: none;

    }


    /* STORY CARD */

    .story-card {

      padding: 16px;

      border-radius: 18px;

      background: var(--surface);

      border: 1px solid var(--border);

    }


    .story-card-top {

      display: flex;

      align-items: center;

      gap: 13px;

    }


    .story-cover {

      width: 62px;

      height: 78px;

      flex-shrink: 0;

      border-radius: 11px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 25px;

      background:

        linear-gradient(

          145deg,

          var(--pink),

          var(--purple)

        );

    }


    .story-details {

      min-width: 0;

      flex: 1;

    }


    .story-details h3 {

      font-size: 15px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

    }


    .story-details p {

      color: var(--muted);

      font-size: 11px;

      margin-top: 6px;

    }


    .story-status {

      display: inline-block;

      margin-top: 8px;

      padding: 5px 8px;

      border-radius: 20px;

      color: var(--pink);

      background: rgba(255,47,141,0.12);

      font-size: 9px;

    }


    .empty-story {

      padding: 25px 15px;

      text-align: center;

      border-radius: 18px;

      border: 1px dashed rgba(255,255,255,0.18);

      color: var(--muted);

      font-size: 12px;

      line-height: 1.5;

    }


    .create-story-button {

      display: inline-block;

      margin-top: 14px;

      padding: 11px 17px;

      border-radius: 11px;

      color: white;

      text-decoration: none;

      font-size: 11px;

      font-weight: bold;

      background:

        linear-gradient(

          135deg,

          var(--pink),

          var(--purple)

        );

    }


    /* MENU */

    .menu-card {

      overflow: hidden;

      border-radius: 18px;

      background: var(--surface);

      border: 1px solid var(--border);

    }


    .menu-item {

      width: 100%;

      min-height: 58px;

      padding: 13px 16px;

      display: flex;

      align-items: center;

      gap: 13px;

      border: none;

      border-bottom: 1px solid var(--border);

      background: transparent;

      color: white;

      text-align: left;

      cursor: pointer;

    }


    .menu-item:last-child {

      border-bottom: none;

    }


    .menu-icon {

      width: 34px;

      height: 34px;

      border-radius: 10px;

      display: flex;

      align-items: center;

      justify-content: center;

      background: var(--surface-light);

      font-size: 17px;

    }


    .menu-text {

      flex: 1;

    }


    .menu-text strong {

      display: block;

      font-size: 13px;

    }


    .menu-text span {

      display: block;

      color: var(--muted);

      font-size: 10px;

      margin-top: 3px;

    }


    .menu-arrow {

      color: var(--muted);

      font-size: 18px;

    }


    /* BOTTOM NAV */

    .bottom-nav {

      position: fixed;

      bottom: 0;

      left: 0;

      right: 0;

      height: 76px;

      display: flex;

      align-items: center;

      justify-content: space-around;

      background: rgba(14,13,21,0.96);

      backdrop-filter: blur(18px);

      border-top: 1px solid var(--border);

      z-index: 30;

    }


    .nav-item {

      min-width: 54px;

      color: var(--muted);

      text-align: center;

      text-decoration: none;

      font-size: 10px;

    }


    .nav-icon {

      display: block;

      font-size: 20px;

      margin-bottom: 4px;

    }


    .nav-item.active {

      color: var(--pink);

    }


    .create-nav {

      position: relative;

      top: -13px;

    }


    .create-icon {

      width: 50px;

      height: 50px;

      margin: auto;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 50%;

      color: white;

      font-size: 26px;

      background:

        linear-gradient(

          135deg,

          var(--pink),

          var(--purple)

        );

      box-shadow:

        0 8px 25px rgba(255,47,141,0.35);

    }


    .create-nav .nav-label {

      display: block;

      margin-top: 3px;

    }


    /* TOAST */

    .toast {

      position: fixed;

      left: 50%;

      bottom: 95px;

      transform: translateX(-50%) translateY(20px);

      padding: 13px 17px;

      border-radius: 12px;

      background: var(--surface-light);

      border: 1px solid var(--border);

      color: white;

      font-size: 12px;

      opacity: 0;

      pointer-events: none;

      transition: 0.3s;

      z-index: 50;

      white-space: nowrap;

    }


    .toast.show {

      opacity: 1;

      transform: translateX(-50%) translateY(0);

    }


    /* MOBILE */

    @media (max-width: 420px) {

      .profile-hero {

        padding-top: 25px;

      }

      .profile-name {

        font-size: 22px;

      }

      .profile-stats {

        margin-left: 14px;

        margin-right: 14px;

      }

      .section {

        padding-left: 14px;

        padding-right: 14px;

      }

    }

  </style>

</head>


<body>


  <div class="app">


    <!-- HEADER -->

    <header class="header">

      <button
        class="back-button"
        onclick="goBack()"
      >

        ←

      </button>


      <div class="header-title">

        Profile

      </div>


      <div class="header-space"></div>

    </header>


    <!-- PROFILE -->

    <section class="profile-hero">


      <div
        class="avatar"
        id="avatar"
      >

        R

      </div>


      <h1
        class="profile-name"
        id="profileName"
      >

        Reitoon Creator

      </h1>


      <p
        class="profile-username"
        id="profileUsername"
      >

        @creator

      </p>


      <p class="profile-bio">

        Creator cerita dan dunia baru di Reitoon ✨

      </p>


      <button
        class="edit-profile-button"
        onclick="editProfile()"
      >

        ✏️ Edit Profile

      </button>


    </section>


    <!-- STATS -->

    <section class="profile-stats">


      <div class="stat">

        <strong id="storyCount">

          0

        </strong>

        <span>

          Stories

        </span>

      </div>


      <div class="stat">

        <strong>

          0

        </strong>

        <span>

          Followers

        </span>

      </div>


      <div class="stat">

        <strong>

          0

        </strong>

        <span>

          Following

        </span>

      </div>


    </section>


    <!-- MY STORY -->

    <section class="section">


      <div class="section-header">

        <h2 class="section-title">

          📚 My Story

        </h2>


        <a
          href="studio.html"
          class="see-all"
        >

          Studio →

        </a>

      </div>


      <div
        id="storyContainer"
      >

        <div class="empty-story">

          Kamu belum membuat cerita.

          <br>

          Mulai buat cerita pertamamu di Reitoon.

          <br>


          <a
            href="create.html"
            class="create-story-button"
          >

            ✨ Create Story

          </a>

        </div>

      </div>


    </section>


    <!-- MENU -->

    <section class="section">


      <div class="section-header">

        <h2 class="section-title">

          ⚙️ Account

        </h2>

      </div>


      <div class="menu-card">


        <button
          class="menu-item"
          onclick="editProfile()"
        >

          <div class="menu-icon">

            ✏️

          </div>


          <div class="menu-text">

            <strong>

              Edit Profile

            </strong>


            <span>

              Ubah nama dan username kamu

            </span>

          </div>


          <div class="menu-arrow">

            ›

          </div>

        </button>


        <button
          class="menu-item"
          onclick="showToast('Fitur pengaturan segera hadir')"
        >

          <div class="menu-icon">

            ⚙️

          </div>


          <div class="menu-text">

            <strong>

              Settings

            </strong>


            <span>

              Atur preferensi akun kamu

            </span>

          </div>


          <div class="menu-arrow">

            ›

          </div>

        </button>


        <button
          class="menu-item"
          onclick="showToast('Help Center segera hadir')"
        >

          <div class="menu-icon">

            ❓

          </div>


          <div class="menu-text">

            <strong>

              Help Center

            </strong>


            <span>

              Bantuan dan dukungan Reitoon

            </span>

          </div>


          <div class="menu-arrow">

            ›

          </div>

        </button>


        <button
          class="menu-item"
          onclick="showToast('Terima kasih sudah menggunakan Reitoon ✨')"
        >

          <div class="menu-icon">

            ❤️

          </div>


          <div class="menu-text">

            <strong>

              About Reitoon

            </strong>


            <span>

              Versi 1.0 • Create Your Story

            </span>

          </div>


          <div class="menu-arrow">

            ›

          </div>

        </button>


      </div>


    </section>


  </div>


  <!-- BOTTOM NAV -->

  <nav class="bottom-nav">


    <a
      class="nav-item"
      href="index.html"
    >

      <span class="nav-icon">

        🏠

      </span>

      Home

    </a>


    <a
      class="nav-item"
      href="watch.html"
    >

      <span class="nav-icon">

        ▶️

      </span>

      Watch

    </a>


    <a
      class="nav-item create-nav"
      href="create.html"
    >

      <span class="create-icon">

        ＋

      </span>

      <span class="nav-label">

        Create

      </span>

    </a>


    <a
      class="nav-item"
      href="studio.html"
    >

      <span class="nav-icon">

        🎥

      </span>

      Studio

    </a>


    <a
      class="nav-item active"
      href="profile.html"
    >

      <span class="nav-icon">

        👤

      </span>

      Profile

    </a>


  </nav>


  <!-- TOAST -->

  <div
    class="toast"
    id="toast"
  ></div>


  <!-- JAVASCRIPT -->

  <script>


    /* LOAD STORY */

    function loadProfileStory() {


      const savedStory =

        localStorage.getItem(
          "reitoon_story"
        );


      if (!savedStory) {

        return;

      }


      const story =

        JSON.parse(savedStory);


      document
        .getElementById(
          "storyCount"
        )
        .textContent = "1";


      document
        .getElementById(
          "storyContainer"
        )
        .innerHTML = `

          <div class="story-card">

            <div class="story-card-top">

              <div class="story-cover">

                🎬

              </div>


              <div class="story-details">

                <h3>

                  ${story.title}

                </h3>


                <p>

                  ${story.type} · ${story.genre}

                </p>


                <span class="story-status">

                  DRAFT

                </span>

              </div>

            </div>

          </div>

        `;

    }


    /* EDIT PROFILE */

    function editProfile() {


      const name =

        prompt(

          "Masukkan nama creator:",

          "Reitoon Creator"

        );


      if (!name) {

        return;

      }


      const username =

        prompt(

          "Masukkan username:",

          "creator"

        );


      if (!username) {

        return;

      }


      localStorage.setItem(

        "reitoon_profile",

        JSON.stringify({

          name: name,

          username: username

        })

      );


      loadProfile();


      showToast(

        "✅ Profile berhasil diperbarui"

      );

    }


    /* LOAD PROFILE */

    function loadProfile() {


      const savedProfile =

        localStorage.getItem(

          "reitoon_profile"

        );


      if (!savedProfile) {

        return;

      }


      const profile =

        JSON.parse(savedProfile);


      document

        .getElementById(

          "profileName"

        )

        .textContent = profile.name;


      document

        .getElementById(

          "profileUsername"

        )

        .textContent =

        "@" +

        profile.username;


      document

        .getElementById(

          "avatar"

        )

        .textContent =

        profile.name

        .charAt(0)

        .toUpperCase();

    }


    /* BACK */

    function goBack() {


      if (

        document.referrer

      ) {

        history.back();

      } else {

        window.location.href =

          "index.html";

      }

    }


    /* TOAST */

    function showToast(

      message

    ) {


      const toast =

        document

        .getElementById(

          "toast"

        );


      toast.textContent =

        message;


      toast.classList.add(

        "show"

      );


      setTimeout(

        () => {

          toast.classList.remove(

            "show"

          );

        },

        2500

      );

    }


    /* INIT */

    loadProfile();

    loadProfileStory();


  </script>


</body>

</html>
