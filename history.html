<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08070d"><title>Riwayat Tonton - Reitoon</title><style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

:root{
--bg:#08070d;
--surface:#191722;
--surface-light:#211f2b;
--text:#ffffff;
--muted:#aaa3b0;
--pink:#ff2f8d;
--purple:#762dff;
--border:rgba(255,255,255,.10);
}

body{
min-height:100vh;
background:
radial-gradient(circle at 100% 0%,rgba(255,40,145,.14),transparent 35%),
radial-gradient(circle at 0% 30%,rgba(112,45,255,.10),transparent 30%),
var(--bg);
color:var(--text);
font-family:Arial,Helvetica,sans-serif;
padding-bottom:100px;
}

.header{
height:76px;
display:flex;
align-items:center;
justify-content:space-between;
padding:16px 20px;
background:rgba(8,7,13,.94);
border-bottom:1px solid var(--border);
position:sticky;
top:0;
z-index:20;
}

.back-button{
width:42px;
height:42px;
border-radius:14px;
border:1px solid var(--border);
background:var(--surface);
color:#fff;
font-size:20px;
cursor:pointer;
}

.logo{
font-size:28px;
font-weight:800;
background:linear-gradient(135deg,#fff,var(--pink),var(--purple));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.header-space{
width:42px;
}

.container{
width:100%;
max-width:700px;
margin:auto;
padding:24px 16px;
}

.page-header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:18px;
}

.page-title{
font-size:22px;
}

.clear-button{
padding:9px 12px;
border-radius:10px;
border:1px solid rgba(255,82,109,.35);
background:rgba(255,82,109,.10);
color:#ff9aaa;
font-size:10px;
font-weight:bold;
cursor:pointer;
}

.history-card{
display:flex;
gap:13px;
padding:13px;
margin-bottom:10px;
border-radius:17px;
background:var(--surface);
border:1px solid var(--border);
}

.history-poster{
width:78px;
height:100px;
flex-shrink:0;
display:flex;
align-items:center;
justify-content:center;
border-radius:12px;
background:linear-gradient(135deg,#351020,#5b1b51);
font-size:32px;
}

.history-info{
flex:1;
min-width:0;
}

.history-title{
font-size:14px;
font-weight:bold;
margin-bottom:7px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.history-meta{
font-size:10px;
color:var(--muted);
margin-bottom:6px;
}

.history-time{
font-size:10px;
color:var(--muted);
margin-bottom:10px;
}

.history-actions{
display:flex;
gap:7px;
}

.watch-button,
.delete-button{
padding:8px 10px;
border-radius:8px;
font-size:10px;
font-weight:bold;
cursor:pointer;
}

.watch-button{
border:none;
background:linear-gradient(135deg,var(--pink),var(--purple));
color:#fff;
}

.delete-button{
border:1px solid var(--border);
background:var(--surface-light);
color:#ff9aaa;
}

.empty{
padding:50px 20px;
text-align:center;
border:1px dashed rgba(255,255,255,.15);
border-radius:18px;
color:var(--muted);
font-size:13px;
line-height:1.7;
}

.empty-icon{
font-size:48px;
margin-bottom:15px;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:76px;
display:flex;
justify-content:space-around;
align-items:center;
background:rgba(14,13,21,.96);
backdrop-filter:blur(18px);
border-top:1px solid var(--border);
z-index:30;
}

.nav-item{
color:var(--muted);
text-decoration:none;
text-align:center;
font-size:10px;
min-width:60px;
}

.nav-icon{
display:block;
font-size:21px;
margin-bottom:4px;
}

.nav-item.active{
color:var(--pink);
}

.toast{
position:fixed;
left:50%;
bottom:95px;
transform:translateX(-50%) translateY(20px);
padding:13px 18px;
border-radius:14px;
background:var(--surface-light);
border:1px solid var(--border);
font-size:12px;
opacity:0;
pointer-events:none;
transition:.3s;
z-index:100;
white-space:nowrap;
}

.toast.show{
opacity:1;
transform:translateX(-50%) translateY(0);
}

@media(max-width:420px){

.history-poster{
width:70px;
height:90px;
}

.history-title{
font-size:12px;
}

}
</style></head><body><header class="header"><button
class="back-button"
onclick="goBack()"

«»

←
</button>

<div class="logo">
Reitoon
</div><div class="header-space"></div></header><main class="container"><div class="page-header"><h1 class="page-title">
🕘 Riwayat Tonton
</h1><button
class="clear-button"
onclick="clearAllHistory()"

«»

Hapus Semua
</button>

</div><section id="historyContainer"></section></main><nav class="bottom-nav"><a
class="nav-item"
href="index.html"

«»

<span class="nav-icon">🏠</span>
Home
</a>

<a
class="nav-item active"
href="watch.html"

«»

<span class="nav-icon">▶️</span>
Watch
</a>

<a
class="nav-item"
href="create.html"

«»

<span class="nav-icon">✨</span>
Create
</a>

<a
class="nav-item"
href="studio.html"

«»

<span class="nav-icon">🎥</span>
Studio
</a>

<a
class="nav-item"
href="profile.html"

«»

<span class="nav-icon">👤</span>
Profile
</a>

</nav><div
class="toast"
id="toast"
></div><script>

function getHistory(){

return JSON.parse(

localStorage.getItem(
"reitoon_watch_history"
)

) || [];

}


function renderHistory(){

const container =
document.getElementById(
"historyContainer"
);

const history =
getHistory();

if(!history.length){

container.innerHTML = `

<div class="empty">

<div class="empty-icon">
🕘
</div>

Belum ada riwayat tontonan.

<br>

Drama yang kamu tonton akan muncul di sini.

</div>

`;

return;

}

container.innerHTML = history.map(function(item,index){

return `

<article class="history-card">

<div class="history-poster">

${item.icon || "🎬"}

</div>

<div class="history-info">

<h3 class="history-title">

${item.title}

</h3>

<div class="history-meta">

${item.category || "Drama"} • ${item.rating || "⭐"}

</div>

<div class="history-time">

🕘 Terakhir ditonton:<br>

${item.watchedAt}

</div>

<div class="history-actions">

<button
class="watch-button"
onclick="continueWatching('${item.id}')"
>
▶️ Lanjutkan
</button>

<button
class="delete-button"
onclick="deleteHistory(${index})"
>
Hapus
</button>

</div>

</div>

</article>

`;

}).join("");

}


function continueWatching(id){

window.location.href =

"detail.html?id=" +

encodeURIComponent(id);

}


function deleteHistory(index){

const history =
getHistory();

history.splice(index,1);

localStorage.setItem(

"reitoon_watch_history",

JSON.stringify(history)

);

renderHistory();

showToast(
"✅ Riwayat dihapus"
);

}


function clearAllHistory(){

const history =
getHistory();

if(!history.length){

showToast(
"ℹ️ Riwayat masih kosong"
);

return;

}

const confirmDelete =
confirm(
"Hapus semua riwayat tontonan?"
);

if(!confirmDelete){

return;

}

localStorage.removeItem(
"reitoon_watch_history"
);

renderHistory();

showToast(
"✅ Semua riwayat dihapus"
);

}


function showToast(message){

const toast =
document.getElementById(
"toast"
);

toast.textContent =
message;

toast.classList.add(
"show"
);

setTimeout(function(){

toast.classList.remove(
"show"
);

},2500);

}


function goBack(){

if(document.referrer){

history.back();

}

else{

window.location.href =
"profile.html";

}

}


renderHistory();

</script></body>
</html>
