<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08070d">
<title>Watch - Reitoon</title><style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--bg:#08070d;
--surface:#191722;
--surface-light:#211f2b;
--text:#fff;
--muted:#aaa3b0;
--pink:#ff2f8d;
--purple:#762dff;
--border:rgba(255,255,255,.1)
}

body{
min-height:100vh;
background:
radial-gradient(circle at 100% 0%,rgba(255,40,145,.14),transparent 35%),
radial-gradient(circle at 0% 30%,rgba(112,45,255,.1),transparent 30%),
var(--bg);
color:white;
font-family:Arial,Helvetica,sans-serif;
padding-bottom:100px
}

.header{
height:76px;
display:flex;
align-items:center;
justify-content:space-between;
padding:16px 20px;
background:rgba(8,7,13,.94);
border-bottom:1px solid var(--border);
position:sticky;
top:0;
z-index:10
}

.logo{
font-size:29px;
font-weight:800;
background:linear-gradient(135deg,#fff,var(--pink),var(--purple));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent
}

.container{
max-width:600px;
margin:auto;
padding:25px 16px
}

h1{font-size:30px}
h1 span{
background:linear-gradient(135deg,var(--pink),var(--purple));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent
}

.subtitle{
color:var(--muted);
font-size:14px;
line-height:1.5;
margin-top:8px
}

.search{
margin-top:20px;
display:flex;
align-items:center;
gap:10px;
padding:14px;
border-radius:14px;
background:var(--surface);
border:1px solid var(--border)
}

.search input{
flex:1;
border:none;
outline:none;
background:none;
color:white;
font-size:14px
}

.categories{
display:flex;
gap:8px;
overflow-x:auto;
margin-top:15px;
padding-bottom:4px
}

.category{
white-space:nowrap;
padding:9px 15px;
border-radius:20px;
border:1px solid var(--border);
background:var(--surface);
color:var(--muted);
font-size:12px
}

.category.active{
background:linear-gradient(135deg,var(--pink),var(--purple));
color:white;
border:none
}

.section-title{
margin-top:25px;
margin-bottom:15px;
font-size:20px
}

.movie-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:13px
}

.movie-card{
overflow:hidden;
border-radius:17px;
background:var(--surface);
border:1px solid var(--border);
cursor:pointer
}

.poster{
height:220px;
position:relative;
display:flex;
align-items:center;
justify-content:center;
background:
linear-gradient(135deg,#40264b,#16121f)
}

.poster.one{
background:linear-gradient(135deg,#8e2f68,#25152e)
}

.poster.two{
background:linear-gradient(135deg,#303d68,#121421)
}

.poster.three{
background:linear-gradient(135deg,#41413b,#181815)
}

.poster.four{
background:linear-gradient(135deg,#a85572,#29151f)
}

.poster.five{
background:linear-gradient(135deg,#4a3370,#15121f)
}

.poster.six{
background:linear-gradient(135deg,#343434,#111)
}

.poster-title{
position:absolute;
bottom:15px;
left:12px;
right:12px;
font-size:17px;
font-weight:bold;
text-shadow:0 2px 8px #000
}

.play{
width:48px;
height:48px;
border-radius:50%;
border:none;
background:rgba(255,47,141,.9);
color:white;
font-size:18px;
cursor:pointer
}

.badge{
position:absolute;
top:10px;
left:10px;
padding:5px 8px;
border-radius:8px;
font-size:9px;
background:var(--pink);
font-weight:bold
}

.info{
padding:12px
}

.info h3{
font-size:14px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.info p{
font-size:11px;
color:var(--muted);
margin-top:5px
}

.creator-card{
grid-column:1/-1;
overflow:hidden;
border-radius:17px;
background:var(--surface);
border:1px solid var(--border);
cursor:pointer
}

.creator-cover{
width:100%;
height:170px;
object-fit:cover;
display:block;
background:linear-gradient(135deg,#392046,#15121e)
}

.creator-info{
padding:14px
}

.creator-info h3{
font-size:17px
}

.creator-info p{
color:var(--muted);
font-size:12px;
margin-top:6px;
line-height:1.5
}

.empty{
grid-column:1/-1;
padding:35px 20px;
text-align:center;
color:var(--muted);
border:1px dashed rgba(255,255,255,.2);
border-radius:18px
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:76px;
display:flex;
justify-content:space-around;
align-items:center;
background:rgba(14,13,21,.96);
border-top:1px solid var(--border);
z-index:20
}

.nav-item{
color:var(--muted);
text-decoration:none;
text-align:center;
font-size:10px;
min-width:60px
}

.nav-icon{
display:block;
font-size:21px;
margin-bottom:4px
}

.nav-item.active{color:var(--pink)}

@media(max-width:450px){
.poster{height:190px}
}
</style></head><body><header class="header">

><div class="poster two"><span class="badge">#2</span>

<div class="poster-title">

</div></div><div class="info">

<p>Romance</p>
</div></article><div id="creatorStories"></div></section></main><nav class="bottom-nav"><a class="nav-item" href="index.html">

Profile
</a></nav><script>

let currentCategory="all";

function openMovie(title,genre,poster){

window.location.href=
"detail.html?title="+
encodeURIComponent(title)+
"&genre="+
encodeURIComponent(genre)+
"&poster="+
poster;

}

function loadCreatorStories(){

const stories=
JSON.parse(localStorage.getItem("reitoon_stories"))||[];

const container=
document.getElementById("creatorStories");

const published=
stories.filter(
story=>story.status==="published"
);

published.forEach(story=>{

const card=document.createElement("article");

card.className="creator-card";

card.dataset.title=story.title.toLowerCase();

card.dataset.genre=story.genre;

card.onclick=function(){

window.location.href=
"detail.html?story="+story.id;

};

card.innerHTML=`

${story.cover
?`<img class="creator-cover" src="${story.cover}">`
:`<div class="creator-cover"></div>`
}

<div class="creator-info">

<h3>${story.title}</h3>

<p>
${story.genre} · ${story.type}<br>
${story.description}
</p>

</div>

`;

container.appendChild(card);

});

}

function filterCategory(category,button){

currentCategory=category;

document
.querySelectorAll(".category")
.forEach(item=>item.classList.remove("active"));

button.classList.add("active");

filterMovies();

}

function filterMovies(){

const keyword=
document.getElementById("search")
.value
.toLowerCase();

const cards=
document.querySelectorAll(
".movie-card,.creator-card"
);

cards.forEach(card=>{

const title=
card.dataset.title.toLowerCase();

const genre=
card.dataset.genre||"";

const matchSearch=
title.includes(keyword);

const matchCategory=
currentCategory==="all"||
genre.toLowerCase().includes(
currentCategory.toLowerCase()
);

card.style.display=
matchSearch&&matchCategory
?"block"
:"none";

});

}

document
.getElementById("search")
.addEventListener(
"input",
filterMovies
);

loadCreatorStories();

</script></body>
