<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch - Reitoon</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="top-header">
    <img src="assets/reitoon-logo.png" class="reitoon-logo" alt="Reitoon">

    <button class="notification">🔔</button>
  </header>

  <main>

    <div class="search-box">
      <span>🔍</span>
      <input
        type="text"
        placeholder="Cari film, drama, atau creator..."
      >
    </div>

    <!-- HERO FILM -->
    <section class="watch-hero">

      <img
        src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=900&q=85"
        alt="Film"
      >

      <div class="watch-overlay"></div>

      <div class="watch-content">

        <div class="hero-badge">
          🎬 REITOON ORIGINAL
        </div>

        <h1>I Accidentally Sexted My Enemy</h1>

        <button class="play-button">
          ▶ Play
        </button>

      </div>

    </section>

    <!-- INDICATOR -->
    <div class="carousel-indicator">
      <span></span>
      <span></span>
      <span class="active"></span>
      <span></span>
      <span></span>
    </div>

    <!-- NEW RELEASE -->
    <section class="section">

      <div class="section-title">
        <h2>New Release</h2>
        <a href="#">View all ›</a>
      </div>

      <div class="movie-row">

        <div class="movie-card">
          <img
            src="https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=500&q=80"
            alt="Movie"
          >
          <h3>New Adventure</h3>
        </div>

        <div class="movie-card">
          <img
            src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=500&q=80"
            alt="Movie"
          >
          <h3>Love Story</h3>
        </div>

        <div class="movie-card">
          <img
            src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=500&q=80"
            alt="Movie"
          >
          <h3>The Mystery</h3>
        </div>

      </div>

    </section>

    <!-- TRENDING -->
    <section class="section trending-section">

      <div class="section-title">
        <h2>🔥 Trending</h2>
        <a href="#">View all ›</a>
      </div>

      <div class="movie-row">

        <div class="movie-card">
          <img
            src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=500&q=80"
            alt="Trending"
          >
          <h3>Trending Now</h3>
        </div>

        <div class="movie-card">
          <img
            src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=500&q=80"
            alt="Trending"
          >
          <h3>Popular Story</h3>
        </div>

        <div class="movie-card">
          <img
            src="https://images.unsplash.com/photo-1440404653325-ab127d49abc1?auto=format&fit=crop&w=500&q=80"
            alt="Trending"
          >
          <h3>Tonight</h3>
        </div>

      </div>

    </section>

  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <a class="nav-item" href="index.html">
      <span>🏠</span>
      <small>Home</small>
    </a>

    <a class="nav-item active" href="watch.html">
      <span>🎬</span>
      <small>Watch</small>
    </a>

    <a class="create-nav" href="#">
      <strong>＋</strong>
      <small>Create</small>
    </a>

    <a class="nav-item" href="#">
      <span>🎞️</span>
      <small>Studio</small>
    </a>

    <a class="nav-item" href="#">
      <span>👤</span>
      <small>Profile</small>
    </a>

  </nav>

</body>
</html>
