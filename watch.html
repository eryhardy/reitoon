<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<meta
name="theme-color"
content="#08070d"
>

<title>Watch - Reitoon</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

:root{

--bg:#08070d;
--surface:#191722;
--surface-light:#211f2b;
--text:#ffffff;
--muted:#aaa3b0;
--pink:#ff2f8d;
--purple:#762dff;
--border:rgba(255,255,255,.10);

}

body{

min-height:100vh;

background:

radial-gradient(
circle at 100% 0%,
rgba(255,40,145,.14),
transparent 35%
),

radial-gradient(
circle at 0% 30%,
rgba(112,45,255,.10),
transparent 30%
),

var(--bg);

color:var(--text);

font-family:
Arial,
Helvetica,
sans-serif;

padding-bottom:100px;

}


/* HEADER */

.header{

height:76px;

display:flex;

align-items:center;

justify-content:space-between;

padding:16px 20px;

background:rgba(8,7,13,.94);

border-bottom:1px solid var(--border);

position:sticky;

top:0;

z-index:20;

}

.logo{

font-size:29px;

font-weight:800;

background:

linear-gradient(
135deg,
white,
var(--pink),
var(--purple)
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

.profile-button{

width:42px;

height:42px;

display:flex;

align-items:center;

justify-content:center;

border-radius:14px;

background:var(--surface);

border:1px solid var(--border);

color:white;

text-decoration:none;

font-size:20px;

}


/* MAIN */

.container{

width:100%;

max-width:700px;

margin:auto;

padding:25px 16px;

}

.page-title{

font-size:30px;

margin-bottom:7px;

}

.page-title span{

background:

linear-gradient(
135deg,
var(--pink),
var(--purple)
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

.subtitle{

color:var(--muted);

font-size:13px;

line-height:1.5;

margin-bottom:22px;

}


/* SEARCH */

.search-box{

display:flex;

gap:10px;

margin-bottom:20px;

}

.search-box input{

flex:1;

padding:14px;

border-radius:13px;

border:1px solid var(--border);

outline:none;

background:var(--surface);

color:white;

font-size:13px;

}

.search-box input:focus{

border-color:var(--pink);

}

.search-button{

width:48px;

border:none;

border-radius:13px;

background:

linear-gradient(
135deg,
var(--pink),
var(--purple)
);

color:white;

font-size:19px;

}


/* FILTER */

.filters{

display:flex;

gap:8px;

overflow-x:auto;

padding-bottom:6px;

margin-bottom:22px;

}

.filters::-webkit-scrollbar{

display:none;

}

.filter{

flex-shrink:0;

padding:9px 14px;

border-radius:20px;

border:1px solid var(--border);

background:var(--surface);

color:var(--muted);

font-size:11px;

cursor:pointer;

}

.filter.active{

background:

linear-gradient(
135deg,
var(--pink),
var(--purple)
);

color:white;

border-color:transparent;

}


/* SECTION */

.section-header{

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:14px;

}

.section-header h2{

font-size:18px;

}

.section-header span{

font-size:11px;

color:var(--muted);

}


/* MOVIE GRID */

.movie-grid{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:14px;

}


/* MOVIE CARD */

.movie-card{

overflow:hidden;

border-radius:18px;

background:var(--surface);

border:1px solid var(--border);

cursor:pointer;

transition:.2s;

}

.movie-card:hover{

transform:translateY(-3px);

border-color:var(--pink);

}

.movie-poster{

position:relative;

height:220px;

display:flex;

align-items:center;

justify-content:center;

background:

linear-gradient(
135deg,
var(--pink),
var(--purple)
);

font-size:42px;

overflow:hidden;

}

.movie-poster img{

width:100%;

height:100%;

object-fit:cover;

}

.play-button{

position:absolute;

right:10px;

bottom:10px;

width:38px;

height:38px;

border-radius:50%;

border:1px solid rgba(255,255,255,.3);

background:rgba(0,0,0,.65);

color:white;

font-size:16px;

cursor:pointer;

}

.movie-info{

padding:13px;

}

.movie-title{

font-size:14px;

font-weight:bold;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

margin-bottom:7px;

}

.movie-meta{

display:flex;

gap:6px;

flex-wrap:wrap;

}

.badge{

padding:5px 7px;

border-radius:7px;

background:var(--surface-light);

color:var(--muted);

font-size:9px;

}


/* EMPTY */

.empty{

grid-column:1/-1;

padding:42px 20px;

text-align:center;

border-radius:20px;

background:rgba(255,255,255,.02);

border:1px dashed rgba(255,255,255,.15);

color:var(--muted);

font-size:13px;

line-height:1.6;

}

.empty-icon{

font-size:45px;

margin-bottom:14px;

}


/* BOTTOM NAV */

.bottom-nav{

position:fixed;

bottom:0;

left:0;

right:0;

height:76px;

display:flex;

justify-content:space-around;

align-items:center;

background:rgba(14,13,21,.96);

backdrop-filter:blur(18px);

border-top:1px solid var(--border);

z-index:30;

}

.nav-item{

color:var(--muted);

text-decoration:none;

text-align:center;

font-size:10px;

min-width:60px;

}

.nav-icon{

display:block;

font-size:21px;

margin-bottom:4px;

}

.nav-item.active{

color:var(--pink);

}


/* MOBILE */

@media(max-width:420px){

.movie-poster{

height:190px;

}

}

</style>

</head>

<body>


<!-- HEADER -->

<header class="header">

<div class="logo">

Reitoon

</div>

<a
class="profile-button"
href="profile.html"
>

👤

</a>

</header>


<!-- MAIN -->

<main class="container">


<h1 class="page-title">

Watch <span>Reitoon</span>

</h1>

<p class="subtitle">

Temukan film dan cerita yang dibuat oleh creator Reitoon.

</p>


<!-- SEARCH -->

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Cari film atau cerita..."
oninput="searchMovies()"
>

<button
class="search-button"
onclick="searchMovies()"
>

🔍

</button>

</div>


<!-- FILTER -->

<div class="filters">

<button
class="filter active"
onclick="filterGenre('All',this)"
>

All

</button>

<button
class="filter"
onclick="filterGenre('Romance',this)"
>

Romance

</button>

<button
class="filter"
onclick="filterGenre('Action',this)"
>

Action

</button>

<button
class="filter"
onclick="filterGenre('Drama',this)"
>

Drama

</button>

<button
class="filter"
onclick="filterGenre('Fantasy',this)"
>

Fantasy

</button>

</div>


<!-- HEADER -->

<div class="section-header">

<h2>

🔥 Popular Stories

</h2>

<span
id="storyCount"
>

0 Stories

</span>

</div>


<!-- MOVIES -->

<div
class="movie-grid"
id="movieGrid"
>

</div>


</main>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">


<a
class="nav-item"
href="index.html"
>

<span class="nav-icon">

🏠

</span>

Home

</a>


<a
class="nav-item active"
href="watch.html"
>

<span class="nav-icon">

▶️

</span>

Watch

</a>


<a
class="nav-item"
href="create.html"
>

<span class="nav-icon">

✨

</span>

Create

</a>


<a
class="nav-item"
href="studio.html"
>

<span class="nav-icon">

🎥

</span>

Studio

</a>


<a
class="nav-item"
href="profile.html"
>

<span class="nav-icon">

👤

</span>

Profile

</a>


</nav>


<script>


let allMovies=[];

let activeGenre="All";


/* LOAD MOVIES */

function loadMovies(){

const savedStory=

localStorage.getItem(
"reitoon_story"
);


allMovies=[];


if(savedStory){

const story=
JSON.parse(savedStory);


if(story.published){

allMovies.push(story);

}

}


renderMovies(
allMovies
);

}


/* RENDER MOVIES */

function renderMovies(movies){

const grid=

document
.getElementById(
"movieGrid"
);


document
.getElementById(
"storyCount"
)
.textContent=

movies.length+
" Stories";


if(!movies.length){

grid.innerHTML=

`

<div class="empty">

<div class="empty-icon">

🎬

</div>

Belum ada film yang dipublish.

<br><br>

Buat cerita di Create lalu publish melalui Studio.

</div>

`;

return;

}


grid.innerHTML=

movies
.map(function(movie,index){

const cover=

movie.cover

?

`

<img
src="${movie.cover}"
alt="Cover"
>

`

:

`

🎬

`;


return`

<article
class="movie-card"
onclick="openMovie(${index})"
>

<div class="movie-poster">

${cover}

<button
class="play-button"
onclick="event.stopPropagation(); openMovie(${index})"
>

▶

</button>

</div>

<div class="movie-info">

<div class="movie-title">

${escapeHTML(movie.title)}

</div>

<div class="movie-meta">

<span class="badge">

${escapeHTML(movie.genre || "Story")}

</span>

<span class="badge">

${escapeHTML(movie.type || "Film")}

</span>

</div>

</div>

</article>

`;

})
.join("");

}


/* OPEN DETAIL */

function openMovie(index){

const movie=
filteredMovies()[index];


localStorage.setItem(

"reitoon_selected_movie",

JSON.stringify(movie)

);


window.location.href=
"detail.html";

}


/* SEARCH */

function searchMovies(){

renderMovies(
filteredMovies()
);

}


/* FILTER */

function filterGenre(genre,button){

activeGenre=
genre;


document
.querySelectorAll(
".filter"
)
.forEach(function(item){

item.classList.remove(
"active"
);

});


button.classList.add(
"active"
);


renderMovies(
filteredMovies()
);

}


/* FILTER DATA */

function filteredMovies(){

const search=

document
.getElementById(
"searchInput"
)
.value
.toLowerCase()
.trim();


return allMovies.filter(
function(movie){

const matchesSearch=

movie.title
.toLowerCase()
.includes(search);


const matchesGenre=

activeGenre==="All"

||

movie.genre===
activeGenre;


return matchesSearch
&&
matchesGenre;

}

);

}


/* ESCAPE */

function escapeHTML(text){

const div=
document.createElement(
"div"
);

div.textContent=
text || "";

return div.innerHTML;

}


loadMovies();

</script>

</body>

</html>
