*{
box-sizing:border-box;
margin:0;
padding:0
}

:root{

--bg:#08070d;
--surface:#191722;
--surface-light:#211f2b;
--text:#fff;
--muted:#aaa3b0;
--pink:#ff2f8d;

body{

background:

radial-gradient(
circle at 100% 0%,
rgba(255,40,145,.14),
transparent 35%
),

radial-gradient(
circle at 0% 30%,
rgba(112,45,255,.1),

.header{

.container{

.hero{

padding:24px;

margin-bottom:20px;

135deg,

.hero p{

.search-box{

.search-button{

width:52px;

border:none;

linear-gradient(
135deg,

var(--purple)

}

.category-scroll{

display:flex;

gap:9px;

margin-bottom:20px

}

.category-scroll::-webkit-scrollbar{

display:none

}

.category-button{

white-space:nowrap;

padding:10px 15px;

border-radius:20px;

border:1px solid var(--border);

background:var(--surface);

color:var(--muted);

font-size:11px;

}

.category-button.active{

linear-gradient(
135deg,

var(--purple)
);

}

.section-header{

display:flex;

align-items:center;

justify-content:space-between;

}

.section-title{

font-size:18px

}

.section-count{

font-size:11px;

color:var(--muted)

}

.drama-grid{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:12px

}

.drama-card{

overflow:hidden;

border-radius:18px;

background:var(--surface);

border:1px solid var(--border);

transition:.2s

}

.drama-card:hover{

transform:translateY(-3px);

border-color:var(--pink)

}

.poster{

height:210px;

display:flex;

align-items:center;

justify-content:center;

position:relative;

font-size:48px;

background:

linear-gradient(
135deg,
#351020,
#5b1b51
)

}

.poster:nth-child(2n){

background:

linear-gradient(
135deg,
#101f3e,
#44206d
)

}

.poster:nth-child(3n){

background:

linear-gradient(
135deg,
#291c0d,
#6d3518
)

}

.poster:nth-child(4n){

background:

linear-gradient(
135deg,
#111c28,
#263f5c
)

}

.badge{

position:absolute;

top:10px;

left:10px;

padding:5px 8px;

border-radius:7px;

font-size:9px;

font-weight:bold

}

.badge.free{

background:

rgba(37,211,102,.18);

color:#8cffb1

}

.badge.licensed{

background:

rgba(255,211,90,.18);

color:var(--yellow)

}

.drama-info{

padding:13px

}

.drama-title{

font-size:14px;

font-weight:bold;

margin-bottom:6px;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis

}

.drama-meta{

font-size:10px;

color:var(--muted);

margin-bottom:8px

}

.drama-description{

font-size:10px;

color:var(--muted);

line-height:1.5;

height:31px;

overflow:hidden;

margin-bottom:12px

}

.drama-actions{

display:flex;

gap:7px

}

.watch-button,

.detail-button{

flex:1;

padding:9px 5px;

border-radius:9px;

font-size:10px;

font-weight:bold;

cursor:pointer;

text-align:center;

text-decoration:none

}

.watch-button{

border:none;

background:

linear-gradient(
135deg,
var(--pink),
var(--purple)
);

color:#fff

}

.watch-button.disabled{

background:

var(--surface-light);

color:var(--muted);

border:1px solid var(--border);

cursor:not-allowed

}

.detail-button{

border:1px solid var(--border);

background:var(--surface-light);

color:#fff

}

.empty{

padding:40px 15px;

text-align:center;

color:var(--muted);

font-size:13px;

border:1px dashed rgba(255,255,255,.15);

border-radius:18px;

display:none

}

.bottom-nav{

position:fixed;

bottom:0;

left:0;

right:0;

height:76px;

display:flex;

justify-content:space-around;

align-items:center;

background:rgba(14,13,21,.96);

backdrop-filter:blur(18px);

border-top:1px solid var(--border);

z-index:30

}

.nav-item{

color:var(--muted);

text-decoration:none;

text-align:center;

font-size:10px;

min-width:60px

}

.nav-icon{

display:block;

font-size:21px;

margin-bottom:4px

}

.nav-item.active{

color:var(--pink)

}

@media(min-width:700px){

.drama-grid{

grid-template-columns:
repeat(4,1fr)

}

.poster{

height:250px

}

}

/* =====================================
   REITOON WATCH DATABASE
===================================== */

const TOTAL_VIDEOS = 500;

let currentCategory = "all";


/* =====================================
   KATEGORI
===================================== */

const categories = [

"romance",

"fantasy",

"wuxia",

"historical",

"modern"

];


const icons = [

"❤️",

"✨",

"⚔️",

"🏯",

"🌸",

"🔥",

"🌙",

"💫",

"🐉",

"👑"

];


/* =====================================
   VIDEO LEGAL
=====================================

   Tambahkan hanya video yang:

   ✓ Milik kamu
   ✓ Public Domain
   ✓ CC0
   ✓ Memiliki lisensi
   ✓ Memiliki izin redistribusi

   Jangan memasukkan URL video tanpa izin.
===================================== */

const legalVideos = [

/*

Contoh format:

{

id:
"legal-001",

title:
"Judul Drama Legal",

category:
"romance",

type:
"licensed",

year:
"2026",

episodes:
"Episode 1",

rating:
"⭐ 8.5",

icon:
"❤️",

description:
"Deskripsi drama legal.",

videoUrl:
"URL_VIDEO_LEGAL",

posterUrl:
"",

license:
"Lisensi resmi"

}

*/

];


/* =====================================
   GENERATE 500 KATALOG
===================================== */

const generatedCatalog = [];


for(

let i = 1;

i <= TOTAL_VIDEOS;

i++

){

const category =

categories[

(i - 1)

%

categories.length

];


generatedCatalog.push({

id:

"reitoon-" +

String(i)

.padStart(3,"0"),


title:

"Chinese Drama Collection " +

String(i)

.padStart(3,"0"),


category:


category,


type:

"free",


year:

"Legal Catalog",


episodes:

"Video",


rating:

"⭐ " +

(

8 +

((i % 20) / 10)

)

.toFixed(1),


icon:

icons[

(i - 1)

%

icons.length

],


description:

"Drama Asia dalam katalog Reitoon. Konten hanya dapat ditayangkan apabila memiliki hak penggunaan atau izin redistribusi yang sesuai.",


videoUrl:

"",


posterUrl:

"",


license:

"Belum diverifikasi"

});

}


/* =====================================
   DATABASE UTAMA
===================================== */

const dramas = [

...legalVideos,

...generatedCatalog

];


/* =====================================
   RENDER DRAMA
===================================== */

function renderDramas(list){

const grid =

document

.getElementById(

"dramaGrid"

);


const empty =

document

.getElementById(

"emptyState"

);


const count =

document

.getElementById(

"resultCount"

);


count.textContent =

list.length +

" Video";


if(!list.length){

grid.innerHTML = "";

empty.style.display =

"block";

return;

}


empty.style.display =

"none";


grid.innerHTML =

list

.map(function(drama){

const canWatch =

drama.videoUrl &&

drama.videoUrl.trim() !== "";


return `

<article
class="drama-card"
>

<div
class="poster"
>

<span>
${drama.icon}
</span>

<div
class="badge ${drama.type}"
>

${
drama.type === "free"

?

"🆓 GRATIS"

:

"📜 BERLISENSI"

}

</div>

</div>

<div
class="drama-info"
>

<h3
class="drama-title"
>

${drama.title}

</h3>

<div
class="drama-meta"
>

${drama.year}

•

${drama.episodes}

•

${drama.rating}

</div>

<p
class="drama-description"
>

${drama.description}

</p>

<div
class="drama-actions"
>

${
canWatch

?

`

<button
class="watch-button"
onclick="openDetail('${drama.id}')"
>

▶️ Tonton

</button>

`

:

`

<button
class="watch-button disabled"
onclick="showLicenseWarning()"
>

🔒 Segera Hadir

</button>

`

}

<button
class="detail-button"
onclick="openDetail('${drama.id}')"
>

Detail

</button>

</div>

</div>

</article>

`;

})

.join("");

}


/* =====================================
   FILTER KATEGORI
===================================== */

function filterCategory(

category,

button

){

currentCategory =

category;


document

.querySelectorAll(

".category-button"

)

.forEach(function(item){

item.classList.remove(

"active"

);

});


button.classList.add(

"active"

);


applyFilters();

}


/* =====================================
   SEARCH + FILTER
===================================== */

function applyFilters(){

const search =

document

.getElementById(

"searchInput"

)

.value

.toLowerCase()

.trim();


const result =

dramas

.filter(function(drama){

const matchSearch =

drama.title

.toLowerCase()

.includes(search);


let matchCategory =

true;


if(

currentCategory ===

"free"

){

matchCategory =

drama.type ===

"free";

}

else if(

currentCategory !==

"all"

){

matchCategory =

drama.category ===

currentCategory;

}


return

matchSearch &&

matchCategory;

});


renderDramas(result);

}


/* =====================================
   DETAIL
===================================== */

function openDetail(id){

localStorage.setItem(

"reitoon_selected_drama",

id

);


window.location.href =

"detail.html?id=" +

encodeURIComponent(id);

}


/* =====================================
   WARNING
===================================== */

function showLicenseWarning(){

alert(

"Video ini belum tersedia karena belum memiliki sumber video legal yang terverifikasi. Tambahkan hanya konten yang kamu miliki atau memiliki izin redistribusi."

);

}


/* =====================================
   BACK
===================================== */

function goBack(){

if(

document.referrer

){

history.back();

}

else{

window.location.href =

"index.html";

}

}


/* =====================================
   INIT
===================================== */

renderDramas(

dramas

);

</script></body></html>
