<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reitoon — Watch</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <!-- HEADER -->
    <header class="top-header">

      <a href="index.html" class="brand">
        <img src="logo.png" alt="Reitoon">
      </a>

      <button class="notification" aria-label="Notifikasi">
        🔔
      </button>

    </header>


    <!-- SEARCH -->
    <div class="search-box">

      <span class="search-icon">🔍</span>

      <input
        type="text"
        placeholder="Cari film, drama, atau creator..."
        aria-label="Cari"
      >

    </div>


    <!-- WATCH HEADER -->
    <section class="content-section watch-section">

      <div class="section-heading">

        <div>
          <span class="section-label">
            REITOON WATCH
          </span>

          <h2>
            🎬 Watch
          </h2>
        </div>

      </div>


      <!-- MOVIE CARD -->
      <article class="watch-card">

        <div class="watch-image">

          <div class="watch-image-content">
            🎬
          </div>

          <div class="watch-badge">
            🎬 REITOON ORIGINAL
          </div>

        </div>


        <div class="watch-info">

          <h3>
            Reitoon Original
          </h3>

          <p>
            Temukan film, drama, dan cerita terbaru dari creator Reitoon.
          </p>

          <button class="watch-button">
            ▶ Play
          </button>

        </div>

      </article>


      <!-- MOVIE CARD -->
      <article class="watch-card">

        <div class="watch-image second">

          <div class="watch-image-content">
            🎞️
          </div>

          <div class="watch-badge">
            ✨ TRENDING
          </div>

        </div>


        <div class="watch-info">

          <h3>
            Trending Story
          </h3>

          <p>
            Tonton cerita yang sedang populer di Reitoon.
          </p>

          <button class="watch-button">
            ▶ Play
          </button>

        </div>

      </article>

    </section>

  </main>


  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <a href="index.html" class="nav-item">

      <span class="nav-icon">🏠</span>
      <span>Home</span>

    </a>


    <a href="watch.html" class="nav-item active">

      <span class="nav-icon">🎬</span>
      <span>Watch</span>

    </a>


    <a href="#" class="nav-create">

      <span class="plus">+</span>
      <span>Create</span>

    </a>


    <a href="#" class="nav-item">

      <span class="nav-icon">🎞️</span>
      <span>Studio</span>

    </a>


    <a href="#" class="nav-item">

      <span class="nav-icon">👤</span>
      <span>Profile</span>

    </a>

  </nav>


</body>
</html>
