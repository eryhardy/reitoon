<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08070d">
<title>Watch - Reitoon</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--bg:#08070d;
--surface:#191722;
--surface-light:#211f2b;
--muted:#aaa3b0;
--pink:#ff2f8d;
--purple:#762dff;
--border:rgba(255,255,255,.1)
}

body{
min-height:100vh;
background:
radial-gradient(circle at 100% 0%,rgba(255,40,145,.14),transparent 35%),
radial-gradient(circle at 0% 30%,rgba(112,45,255,.1),transparent 30%),
var(--bg);
color:#fff;
font-family:Arial,Helvetica,sans-serif;
padding-bottom:100px
}

.header{
height:76px;
display:flex;
align-items:center;
justify-content:space-between;
padding:16px 20px;
background:rgba(8,7,13,.94);
border-bottom:1px solid var(--border);
position:sticky;
top:0;
z-index:10
}

.logo{
font-size:29px;
font-weight:800;
background:linear-gradient(135deg,#fff,var(--pink),var(--purple));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent
}

.container{
max-width:600px;
margin:auto;
padding:25px 16px
}

.title{font-size:30px}
.title span{
background:linear-gradient(135deg,var(--pink),var(--purple));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent
}

.subtitle{
color:var(--muted);
font-size:13px;
line-height:1.5;
margin-top:8px
}

.search{
width:100%;
margin-top:20px;
padding:14px;
border-radius:13px;
border:1px solid var(--border);
background:var(--surface);
color:#fff;
outline:none
}

.categories{
display:flex;
gap:8px;
overflow-x:auto;
margin-top:15px;
padding-bottom:3px
}

.category{
flex:none;
padding:9px 15px;
border-radius:20px;
border:1px solid var(--border);
background:var(--surface);
color:#aaa3b0;
cursor:pointer
}

.category.active{
background:linear-gradient(135deg,var(--pink),var(--purple));
color:#fff;
border:none
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
margin-top:22px
}

.card{
overflow:hidden;
border-radius:18px;
background:var(--surface);
border:1px solid var(--border);
cursor:pointer
}

.poster{
height:220px;
display:flex;
align-items:center;
justify-content:center;
position:relative;
background:
linear-gradient(135deg,#29132b,#141327)
}

.poster img{
width:100%;
height:100%;
object-fit:cover
}

.poster-placeholder{
font-size:45px
}

.play{
position:absolute;
bottom:12px;
right:12px;
width:42px;
height:42px;
border:none;
border-radius:50%;
background:var(--pink);
color:#fff;
font-size:17px
}

.card-info{
padding:12px
}

.card-title{
font-size:14px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.card-meta{
color:var(--muted);
font-size:11px;
margin-top:5px
}

.badge{
position:absolute;
top:10px;
left:10px;
padding:5px 8px;
border-radius:8px;
font-size:9px;
background:var(--pink);
color:#fff
}

.empty{
grid-column:1/-1;
text-align:center;
padding:50px 20px;
color:var(--muted)
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:76px;
display:flex;
justify-content:space-around;
align-items:center;
background:rgba(14,13,21,.96);
border-top:1px solid var(--border);
z-index:20
}

.nav{
color:var(--muted);
text-decoration:none;
text-align:center;
font-size:10px
}

.nav-icon{
display:block;
font-size:21px;
margin-bottom:4px
}

.nav.active{color:var(--pink)}

@media(max-width:380px){
.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header class="header">

<div class="logo">Reitoon</div>

<div style="width:42px"></div>

</header>

<main class="container">

<h1 class="title">
Watch <span>Stories</span>
</h1>

<p class="subtitle">
Temukan cerita dan film menarik dari creator Reitoon.
</p>

<input
class="search"
id="search"
placeholder="🔍 Cari film atau cerita..."
oninput="renderStories()"
>

<div class="categories">

<button class="category active" onclick="setCategory('all',this)">
All
</button>

<button class="category" onclick="setCategory('Romance',this)">
Romance
</button>

<button class="category" onclick="setCategory('Drama',this)">
Drama
</button>

<button class="category" onclick="setCategory('Action',this)">
Action
</button>

<button class="category" onclick="setCategory('Fantasy',this)">
Fantasy
</button>

</div>

<section class="grid" id="movieGrid"></section>

</main>

<nav class="bottom-nav">

<a class="nav" href="index.html">
<span class="nav-icon">🏠</span>
Home
</a>

<a class="nav active" href="watch.html">
<span class="nav-icon">▶️</span>
Watch
</a>

<a class="nav" href="create.html">
<span class="nav-icon">✨</span>
Create
</a>

<a class="nav" href="studio.html">
<span class="nav-icon">🎥</span>
Studio
</a>

<a class="nav" href="profile.html">
<span class="nav-icon">👤</span>
Profile
</a>

</nav>

<script>

let category="all";

const defaultMovies=[

{
id:"love-beyond-time",
title:"Love Beyond Time",
genre:"Romance",
description:"Sebuah kisah cinta yang melampaui waktu.",
cover:"",
type:"Film",
status:"public"
},

{
id:"last-kingdom",
title:"The Last Kingdom",
genre:"Action",
description:"Pertarungan besar demi masa depan kerajaan.",
cover:"",
type:"Film",
status:"public"
},

{
id:"hidden-truth",
title:"Hidden Truth",
genre:"Drama",
description:"Sebuah rahasia besar perlahan terungkap.",
cover:"",
type:"Film",
status:"public"
}

];

function getMovies(){

let movies=[...defaultMovies];

const saved=localStorage.getItem("reitoon_story");

if(saved){

const story=JSON.parse(saved);

if(story.status==="public"){

movies.push(story);

}

}

return movies;

}

function setCategory(value,button){

category=value;

document.querySelectorAll(".category")
.forEach(x=>x.classList.remove("active"));

button.classList.add("active");

renderStories();

}

function renderStories(){

const grid=document.getElementById("movieGrid");

const keyword=
document.getElementById("search")
.value.toLowerCase();

const movies=getMovies().filter(movie=>{

const matchSearch=
movie.title.toLowerCase().includes(keyword);

const matchCategory=
category==="all" ||
movie.genre===category;

return matchSearch && matchCategory;

});

grid.innerHTML="";

if(movies.length===0){

grid.innerHTML=
`<div class="empty">😔<br><br>Belum ada cerita ditemukan.</div>`;

return;

}

movies.forEach(movie=>{

const card=document.createElement("article");

card.className="card";

card.onclick=()=>{

window.location.href=
"detail.html?id="+movie.id;

};

const poster=movie.cover

?`<img src="${movie.cover}" alt="${movie.title}">`

:`<div class="poster-placeholder">🎬</div>`;

card.innerHTML=`

<div class="poster">

${poster}

<span class="badge">
${movie.status==="public"?"PUBLIC":"TRENDING"}
</span>

<button class="play" onclick="event.stopPropagation(); openMovie('${movie.id}')">
▶
</button>

</div>

<div class="card-info">

<h3 class="card-title">
${movie.title}
</h3>

<p class="card-meta">
${movie.genre} • ${movie.type}
</p>

</div>

`;

grid.appendChild(card);

});

}

function openMovie(id){

window.location.href=
"detail.html?id="+id;

}

renderStories();

</script>

</body>
</html>
