<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Watch - Reitoon</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="watch-page">

    <!-- HEADER -->
    <header class="watch-header">

        <a href="index.html" class="reitoon-logo">
            <img
                src="reitoon-logo.png"
                alt="Reitoon"
            >
        </a>

        <button class="notification-btn" type="button">
            🔔
        </button>

    </header>


    <!-- SEARCH -->
    <div class="watch-search">

        <span class="search-icon">🔍</span>

        <input
            type="search"
            placeholder="Cari film, drama, atau creator..."
            aria-label="Cari film, drama, atau creator"
        >

    </div>


    <!-- HERO -->
    <section class="watch-hero">

        <div class="hero-content">

            <span class="hero-label">
                🎬 REITOON ORIGINAL
            </span>

            <h1>
                I Accidentally Sexted My Enemy
            </h1>

            <button class="play-btn" type="button">
                ▶ Play
            </button>

        </div>

    </section>


    <!-- CAROUSEL INDICATOR -->
    <div class="carousel-dots" aria-label="Hero carousel">

        <span></span>
        <span></span>
        <span class="active"></span>
        <span></span>
        <span></span>
        <span></span>

    </div>


    <!-- NEW RELEASE -->
    <section class="movie-section">

        <div class="section-title">

            <h2>New Release</h2>

            <a href="#">
                View all ›
            </a>

        </div>


        <div class="movie-row">

            <article class="movie-card">
                <div class="poster poster-one"></div>
            </article>

            <article class="movie-card">

                <div class="poster poster-two">

                    <span class="trending">
                        Trending
                    </span>

                </div>

            </article>

            <article class="movie-card">

                <div class="poster poster-three">

                    <span class="trending">
                        Trending
                    </span>

                </div>

            </article>

        </div>

    </section>


    <!-- TRENDING -->
    <section class="movie-section">

        <div class="section-title">

            <h2>Trending</h2>

            <a href="#">
                View all ›
            </a>

        </div>


        <div class="movie-row">

            <article class="movie-card">
                <div class="poster poster-four"></div>
            </article>

            <article class="movie-card">
                <div class="poster poster-five"></div>
            </article>

            <article class="movie-card">
                <div class="poster poster-six"></div>
            </article>

        </div>

    </section>

</main>


<!-- BOTTOM NAVIGATION -->

        <span>⌂</span>

        <small>
            Home

    </a>

        <span>🎬</span>

    <a href="#">

        <span>♟</span>

        <small>
            Profile

    </a>

</nav>


</body>
</html>
