<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reitoon - Home</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="top-header">

    <a href="index.html" class="reitoon-logo">
      <img src="reitoon-logo.png" alt="Reitoon">
    </a>

    <button class="notification-btn" type="button">
      🔔
    </button>

  </header>


  <main class="page">

    <!-- SEARCH -->
    <div class="search-box">

      <span class="search-icon">🔍</span>

      <input
        type="search"
        placeholder="Cari film, drama, atau creator..."
        aria-label="Cari film"
      >

    </div>


    <!-- CREATE YOUR STORY -->
    <section class="create-card">

      <div class="create-content">

        <div class="create-badge">
          🎬 REITOON ORIGINAL
        </div>

        <h1>
          Create Your Story
        </h1>

        <p>
          Buat, tonton, dan bagikan film kamu sendiri.
        </p>

        <button class="create-button" type="button">
          ✨ Mulai Membuat Film
        </button>

      </div>

    </section>


    <!-- TRENDING -->
    <section class="trending-section">

      <div class="popular-label">
        POPULER SEKARANG
      </div>

      <div class="section-heading">

        <h2 class="trending-title">
          🔥 Trending
        </h2>

        <a href="watch.html" class="view-all">
          Lihat semua
        </a>

      </div>


      <div class="movie-row">

        <article class="movie-card">

          <img
            src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=600&q=85"
            alt="Film Trending"
          >

          <div class="movie-info">
            <h3>Future Love</h3>
          </div>

        </article>


        <article class="movie-card">

          <span class="trending-label">
            Trending
          </span>

          <img
            src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=600&q=85"
            alt="Film Trending"
          >

          <div class="movie-info">
            <h3>Royal Story</h3>
          </div>

        </article>


        <article class="movie-card">

          <span class="trending-label">
            Trending
          </span>

          <img
            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=600&q=85"
            alt="Film Trending"
          >

          <div class="movie-info">
            <h3>Summer Dream</h3>
          </div>

        </article>


        <article class="movie-card">

          <img
            src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=600&q=85"
            alt="Film Trending"
          >

          <div class="movie-info">
            <h3>Last Episode</h3>
          </div>

        </article>

      </div>

    </section>

  </main>


  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <a href="index.html" class="nav-item active">

      <span class="nav-icon">🏠</span>

      <span>Home</span>

    </a>


    <a href="watch.html" class="nav-item">

      <span class="nav-icon">🎬</span>

      <span>Watch</span>

    </a>


    <a href="#" class="nav-item create-nav">

      <span class="nav-icon">＋</span>

      <span>Create</span>

    </a>


    <a href="#" class="nav-item">

      <span class="nav-icon">🎞️</span>

      <span>Studio</span>

    </a>


    <a href="#" class="nav-item">

      <span class="nav-icon">👤</span>

      <span>Profile</span>

    </a>

  </nav>


</body>
</html>
