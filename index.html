<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reitoon</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Container tetap ukuran asli */
.reels-container{
    width:100%;
    max-width:400px;
    height:100%;
    max-height:850px;
    background:#000;
    position:relative;
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
    scrollbar-width:none;
}

.reels-container::-webkit-scrollbar{
    display:none;
}

/* Header Logo */
.header{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:400px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 15px;
    z-index:999;
    pointer-events:none;
}

.logo{
    width:150px;
    height:auto;
}

.notif{
    width:52px;
    height:52px;
    border-radius:50%;
    background:rgba(20,20,20,.8);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    border:1px solid rgba(255,255,255,.15);
}

/* Reel */

.reel-card{
    width:100%;
    height:100%;
    scroll-snap-align:start;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
}

.reel-card video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* Overlay */

.overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
    to top,
    rgba(0,0,0,.75),
    transparent 40%,
    rgba(0,0,0,.15));
}

/* Info */

.reel-info{
    position:absolute;
    bottom:25px;
    left:15px;
    color:#fff;
    z-index:5;
    width:70%;
}

.reel-info h3{
    font-size:18px;
    margin-bottom:6px;
}

.reel-info p{
    font-size:14px;
    color:#ddd;
}

/* Aksi kanan */

.actions{
    position:absolute;
    right:12px;
    bottom:30px;
    display:flex;
    flex-direction:column;
    gap:18px;
    z-index:5;
}

.action{
    display:flex;
    flex-direction:column;
    align-items:center;
    color:#fff;
    font-size:12px;
}

.icon{
    width:50px;
    height:50px;
    border-radius:50%;
    background:rgba(0,0,0,.35);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    margin-bottom:5px;
}
</style>

</head>
<body>

<div class="header">

    <img src="logo.png" class="logo" alt="Reitoon">

    <div class="notif">
        🔔
    </div>

</div>

<div class="reels-container">

    <!-- Reel 1 -->

    <div class="reel-card">

        <video
        src="https://www.w3schools.com/html/mov_bbb.mp4"
        loop
        muted
        playsinline>
        </video>

        <div class="overlay"></div>

        <div class="reel-info">
            <h3>@ReitoonOriginal</h3>
            <p>Episode 1 • Mini Drama Reitoon</p>
        </div>

        <div class="actions">

            <div class="action">
                <div class="icon">❤</div>
                <span>12K</span>
            </div>

            <div class="action">
                <div class="icon">💬</div>
                <span>340</span>
            </div>

            <div class="action">
                <div class="icon">↗</div>
                <span>Bagikan</span>
            </div>

        </div>

    </div>

    <!-- Reel 2 -->

    <div class="reel-card">

        <video
        src="https://www.w3schools.com/html/mov_bbb.mp4"
        loop
        muted
        playsinline>
        </video>

        <div class="overlay"></div>

        <div class="reel-info">
            <h3>@ReitoonStudio</h3>
            <p>Episode 2 • Trending Drama</p>
        </div>

        <div class="actions">

            <div class="action">
                <div class="icon">❤</div>
                <span>9K</span>
            </div>

            <div class="action">
                <div class="icon">💬</div>
                <span>201</span>
            </div>

            <div class="action">
                <div class="icon">↗</div>
                <span>Bagikan</span>
            </div>

        </div>

    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

const videos=document.querySelectorAll("video");

const observer=new IntersectionObserver((entries)=>{

entries.forEach(entry=>{

if(entry.isIntersecting){

entry.target.play().catch(()=>{});

}else{

entry.target.pause();

}

});

},{threshold:0.6});

videos.forEach(video=>{

observer.observe(video);

video.addEventListener("click",()=>{

video.muted=!video.muted;

});

});

});
</script>

</body>
</html>
