<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reitoon — Home</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <!-- HEADER -->
    <header class="top-header">

      <a href="index.html" class="brand">
        <img src="logo.png" alt="Reitoon">
      </a>

      <button class="notification" aria-label="Notifikasi">
        🔔
      </button>

    </header>


    <!-- SEARCH -->
    <div class="search-box">

      <span class="search-icon">🔍</span>

      <input
        type="text"
        placeholder="Cari film, drama, atau creator..."
        aria-label="Cari"
      >

    </div>


    <!-- HERO -->
    <section class="hero">

      <div class="hero-content">

        <div class="hero-label">
          🎬 REITOON ORIGINAL
        </div>

        <h1>
          Create Your Story
        </h1>

        <p>
          Buat, tonton, dan bagikan film kamu sendiri.
        </p>

        <button class="primary-button">
          ✨ Mulai Membuat Film
        </button>

      </div>

    </section>


    <!-- TRENDING -->
    <section class="content-section">

      <div class="section-heading">

        <div>
          <span class="section-label">
            POPULER SEKARANG
          </span>

          <h2>
            🔥 Trending
          </h2>
        </div>

        <a href="watch.html" class="see-all">
          Lihat semua
        </a>

      </div>


      <div class="movie-list">

        <article class="movie-card">

          <div class="movie-placeholder">
            🎬
          </div>

          <div class="movie-info">
            <h3>Reitoon Original</h3>
            <p>Film pilihan terbaru</p>
          </div>

        </article>


        <article class="movie-card">

          <div class="movie-placeholder">
            🎞️
          </div>

          <div class="movie-info">
            <h3>Trending Story</h3>
            <p>Film yang sedang populer</p>
          </div>

        </article>

      </div>

    </section>

  </main>


  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <a href="index.html" class="nav-item active">

      <span class="nav-icon">🏠</span>
      <span>Home</span>

    </a>


    <a href="watch.html" class="nav-item">

      <span class="nav-icon">🎬</span>
      <span>Watch</span>

    </a>


    <a href="#" class="nav-create">

      <span class="plus">+</span>
      <span>Create</span>

    </a>


    <a href="#" class="nav-item">

      <span class="nav-icon">🎞️</span>
      <span>Studio</span>

    </a>


    <a href="#" class="nav-item">

      <span class="nav-icon">👤</span>
      <span>Profile</span>

    </a>

  </nav>


</body>
</html>
