<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reitoon</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="top-header">
    <img src="assets/reitoon-logo.png" class="reitoon-logo" alt="Reitoon">

    <button class="notification">🔔</button>
  </header>

  <main>

    <div class="search-box">
      <span>🔍</span>
      <input
        type="text"
        placeholder="Cari film, drama, atau creator..."
      >
    </div>

    <section class="hero-card">

      <div class="hero-badge">
        🎬 REITOON ORIGINAL
      </div>

      <h1>Create Your Story</h1>

      <p>
        Buat, tonton, dan bagikan film kamu sendiri.
      </p>

      <button class="create-button">
        ✨ Mulai Membuat Film
      </button>

    </section>

    <section class="section">

      <div class="section-title">
        <div>
          <small>POPULER SEKARANG</small>
          <h2>🔥 Trending</h2>
        </div>

        <a href="#">Lihat semua</a>
      </div>

      <div class="movie-row">

        <div class="movie-card">
          <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=500&q=80">
          <h3>Movie Story</h3>
        </div>

        <div class="movie-card">
          <img src="https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=500&q=80">
          <h3>Dream Night</h3>
        </div>

        <div class="movie-card">
          <img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=500&q=80">
          <h3>New Story</h3>
        </div>

      </div>

    </section>

  </main>

  <nav class="bottom-nav">

    <a class="nav-item active" href="index.html">
      <span>🏠</span>
      <small>Home</small>
    </a>

    <a class="nav-item" href="watch.html">
      <span>🎬</span>
      <small>Watch</small>
    </a>

    <a class="create-nav" href="#">
      <strong>＋</strong>
      <small>Create</small>
    </a>

    <a class="nav-item" href="#">
      <span>🎞️</span>
      <small>Studio</small>
    </a>

    <a class="nav-item" href="#">
      <span>👤</span>
      <small>Profile</small>
    </a>

  </nav>

</body>
</html>
